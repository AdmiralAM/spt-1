name: Admiral Trader Quest Runtime

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/server/**'
      - 'mods/Admiral-Trader/db/quests/**'
      - 'mods/Admiral-Trader/db/locales/**'
      - '.github/workflows/admiral-trader-quest-runtime-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-quest-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-quest-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Admiral Trader server runtime
        run: dotnet build mods/Admiral-Trader/server/AdmiralTrader.Server.csproj -c Release

      - name: Validate packaged quest runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('mods/Admiral-Trader/server/bin/Release/net10.0')
          quest_dir = out / 'db/quests'
          locale_dir = out / 'db/locales'
          quest_files = sorted(quest_dir.glob('*.json')) if quest_dir.is_dir() else []
          if len(quest_files) != 31:
              raise SystemExit(f'expected 31 packaged quest templates, got {len(quest_files)}')

          intro_id = '5d404ebd654de4efecef71d2'
          intro_targets = {'5780cf942459777df90dcb72', '59148c8a86f774197930e983'}
          quest_ids = []
          access_ids = []
          arsenal_combat_ids = []
          qualification_ids = []
          caliber_proof_ids = []
          for path in quest_files:
              quest = json.loads(path.read_text(encoding='utf-8-sig'))
              quest_ids.append(quest['_id'])
              if quest['traderId'] != 'd5c27bb3169f8dfbc13f6b69':
                  raise SystemExit(f'{path.name}: trader id drift')
              quest_name = str(quest.get('QuestName') or '')
              if not quest_name.strip():
                  raise SystemExit(f'{path.name}: missing QuestName fallback')
              is_arsenal = quest_name.startswith('Arsenal Protocol:')

              finish = (quest.get('conditions') or {}).get('AvailableForFinish') or []
              if len(finish) != 1:
                  raise SystemExit(f'{path.name}: expected exactly one finish condition')
              condition = finish[0]
              condition_type = condition.get('conditionType')
              if condition_type in ('FindItem', 'HandoverItem'):
                  if is_arsenal:
                      raise SystemExit(f'{path.name}: Arsenal may not use possession/readiness item semantics')
                  if condition.get('onlyFoundInRaid') is not False:
                      raise SystemExit(f'{path.name}: item proof must be non-FIR')
                  if not condition.get('target') or not condition.get('value') or condition.get('value') <= 0:
                      raise SystemExit(f'{path.name}: malformed item proof')
                  if condition_type == 'HandoverItem':
                      if quest['_id'] != intro_id:
                          raise SystemExit(f'{path.name}: HandoverItem is reserved for Fundamentals')
                      if set(condition.get('target') or []) != intro_targets or condition.get('value') != 2:
                          raise SystemExit(f'{path.name}: Fundamentals handover target drift')
                  access_ids.append(quest['_id'])
              elif condition_type == 'CounterCreator':
                  if not is_arsenal or quest.get('type') != 'Elimination':
                      raise SystemExit(f'{path.name}: CounterCreator must be Arsenal combat')
                  counter_conditions = (condition.get('counter') or {}).get('conditions') or []
                  if len(counter_conditions) != 1:
                      raise SystemExit(f'{path.name}: expected one combat counter condition')
                  kill = counter_conditions[0]
                  if kill.get('conditionType') != 'Kills' or not kill.get('weapon'):
                      raise SystemExit(f'{path.name}: malformed Arsenal kill filter')
                  arsenal_combat_ids.append(quest['_id'])
                  if condition.get('value') == 1 and not kill.get('weaponCaliber'):
                      qualification_ids.append(quest['_id'])
                  if kill.get('weaponCaliber'):
                      caliber_proof_ids.append(quest['_id'])
              else:
                  raise SystemExit(f'{path.name}: unsupported finish condition {condition_type!r}')

          if len(quest_ids) != len(set(quest_ids)):
              raise SystemExit('packaged quest ids are not unique')
          if len(access_ids) != 10 or len(arsenal_combat_ids) != 21 or len(qualification_ids) != 7:
              raise SystemExit('packaged quest mix drifted: ' f'Access={len(access_ids)}/10, ' f'ArsenalCombat={len(arsenal_combat_ids)}/21, ' f'Qualification={len(qualification_ids)}/7')
          if len(caliber_proof_ids) != 6:
              raise SystemExit(f'expected six packaged caliber-constrained Munitions proofs, got {len(caliber_proof_ids)}')

          required_fields = ('name', 'description', 'note', 'startedMessageText', 'successMessageText', 'failMessageText', 'acceptPlayerMessage', 'declinePlayerMessage', 'completePlayerMessage', 'changeQuestMessageText')
          locale_sets = {'en': ('en.json', 'arsenal-en.json'), 'ru': ('ru.json', 'arsenal-ru.json')}
          for locale_code, files in locale_sets.items():
              merged = {}
              for filename in files:
                  path = locale_dir / filename
                  if not path.is_file():
                      raise SystemExit(f'missing packaged locale: {path}')
                  payload = json.loads(path.read_text(encoding='utf-8-sig'))
                  overlap = set(merged) & set(payload)
                  if overlap:
                      raise SystemExit(f'{filename}: duplicate locale keys across files: {sorted(overlap)[:5]}')
                  merged.update(payload)
              for qid in quest_ids:
                  for field in required_fields:
                      key = f'{qid} {field}'
                      if key not in merged:
                          raise SystemExit(f'{locale_code}: missing required locale key {key}')
          PY
