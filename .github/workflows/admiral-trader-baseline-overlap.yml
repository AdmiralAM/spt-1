name: Admiral Trader Baseline Overlap

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-baseline-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-baseline-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-overlap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned trader assorts
        run: |
          set -euo pipefail
          mkdir -p build/baseline-overlap/vanilla
          SPT_REF=fe74b07c6361e2c6d1532dc21ba1c3b981d88d93
          SPT_ROOT="https://raw.githubusercontent.com/sp-tarkov/server-csharp/${SPT_REF}/Libraries/SPTarkov.Server.Assets/SPT_Data/database/traders"
          for trader in \
            54cb50c76803fa8b248b4571 \
            54cb57776803fa99248b456e \
            579dc571d53a0658a154fbec \
            58330581ace78e27b8b10cee \
            5935c25fb3acc3127c3d8cd9 \
            5a7c2eca46aef81a7ca2145d \
            5ac3b934156ae10c4430e83c \
            5c0647fdd443bc2504c2d371 \
            638f541a29ffd1183d187f57
          do
            curl --fail --location --retry 3 \
              --output "build/baseline-overlap/vanilla/${trader}.json" \
              "${SPT_ROOT}/${trader}/assort.json"
          done

          curl --fail --location --retry 3 \
            --output build/baseline-overlap/scorpion.json \
            https://raw.githubusercontent.com/acidphantasm/scorpion-csharp/7d1bed766f859f227680377acc1e20c8f97b09bf/Server/data/assort.json

          curl --fail --location --retry 3 \
            --output build/baseline-overlap/artem.json \
            https://raw.githubusercontent.com/WelcomeToThursday/WTT-Artem/ee5b7c13a1980ff961ed0b2c1d8764574377b2bf/Resources/db/assort.json

      - name: Audit baseline stock overlap
        run: |
          args=()
          for assort in build/baseline-overlap/vanilla/*.json; do
            args+=(--provider "vanilla=${assort}")
          done
          python mods/Admiral-Trader/tools/audit_baseline_stock_overlap.py \
            mods/Admiral-Trader/manifests/baseline-stock.json \
            "${args[@]}" \
            --provider Scorpion=build/baseline-overlap/scorpion.json \
            --provider Artem=build/baseline-overlap/artem.json \
            --output build/admiral-trader-baseline-overlap.json

      - name: Enforce Gameplay Alpha third-party identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/admiral-trader-baseline-overlap.json').read_text(encoding='utf-8'))
          required = {'vanilla', 'Scorpion', 'Artem'}
          if set(report['providers']) != required:
              raise SystemExit(f"provider coverage drift: {report['providers']}")
          third_party = []
          for row in report['offers']:
              overlaps = set(row['overlapProviders']) & {'Scorpion', 'Artem'}
              if overlaps:
                  third_party.append((row['tpl'], sorted(overlaps)))
          if third_party:
              raise SystemExit(f'Gameplay Alpha baseline directly duplicates Scorpion/Artem: {third_party}')
          if report['offerCount'] < 1:
              raise SystemExit('baseline catalogue unexpectedly empty')
          print(json.dumps(report['summary'], sort_keys=True))
          PY

      - name: Upload overlap evidence
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-baseline-overlap-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/admiral-trader-baseline-overlap.json
          if-no-files-found: error
          retention-days: 14
