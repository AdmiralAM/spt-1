name: Admiral Trader Weapon Ammo

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-weapon-ammo-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-weapon-ammo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weapon-ammo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Admiral Trader unit tests
        run: python -m unittest discover -s mods/Admiral-Trader/tests -p 'test_*.py'

      - name: Validate authored weapon-ammo manifest syntax
        run: python -m json.tool mods/Admiral-Trader/manifests/weapon-ammo-authored-spec.json > /dev/null

      - name: Checkout pinned legacy corpus
        uses: actions/checkout@v4
        with:
          repository: Thirt3nth/Andrudis-Questmaniac
          ref: 4e15990ac18f469ef7818475ce8553bbbb7cebb4
          path: legacy-andrudis
          fetch-depth: 1

      - name: Build authoritative legacy inventory
        run: >-
          python mods/Admiral-Trader/tools/build_inventory.py
          legacy-andrudis/db/QuestBundles
          --rules mods/Admiral-Trader/manifests/campaign-manifest.json
          --output build/admiral-trader-inventory.json

      - name: Build weapon-ammo domain audit
        run: >-
          python mods/Admiral-Trader/tools/build_weapon_ammo_audit.py
          build/admiral-trader-inventory.json
          --output build/admiral-trader-weapon-ammo-audit.json

      - name: Enforce weapon-ammo rewrite assumptions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('build/admiral-trader-weapon-ammo-audit.json').read_text(encoding='utf-8'))
          summary = audit['summary']
          counts = summary['bundleQuestCounts']
          if set(counts) != {'Weapon Proficiency', 'Ammo Proficiency'}:
              raise SystemExit(f'weapon/ammo audit bundle drift: {counts}')
          if summary['questCount'] != 438:
              raise SystemExit(f'weapon/ammo corpus drift: {summary["questCount"]} != 438')
          if summary['crossBundleEdgeCount'] != 23:
              raise SystemExit(f'weapon/ammo cross-bundle edge drift: {summary["crossBundleEdgeCount"]} != 23')
          if summary['totalAssortmentUnlocks'] != 768:
              raise SystemExit(f'legacy unlock count drift: {summary["totalAssortmentUnlocks"]} != 768')
          PY

      - name: Validate compact authored progression against legacy audit and reward policy
        run: >-
          python mods/Admiral-Trader/tools/validate_weapon_ammo_authored_spec.py
          mods/Admiral-Trader/manifests/weapon-ammo-authored-spec.json
          mods/Admiral-Trader/manifests/reward-policy.json
          --audit build/admiral-trader-weapon-ammo-audit.json

      - name: Upload weapon-ammo evidence
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-weapon-ammo-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/admiral-trader-weapon-ammo-audit.json
          if-no-files-found: error
          retention-days: 7
