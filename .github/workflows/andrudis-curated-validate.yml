name: Andrudis Curated Validate

on:
  pull_request:
    paths:
      - 'mods/SPT-Andrudis-Curated/**'
      - '.github/workflows/andrudis-curated-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andrudis-curated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run inventory/graph tests
        run: python -m unittest discover -s mods/SPT-Andrudis-Curated/tests -p 'test_*.py'

      - name: Validate seed rules JSON
        run: python -m json.tool mods/SPT-Andrudis-Curated/manifests/seed-rules.json > /dev/null

      - name: Checkout pinned legacy corpus
        uses: actions/checkout@v4
        with:
          repository: Thirt3nth/Andrudis-Questmaniac
          ref: 4e15990ac18f469ef7818475ce8553bbbb7cebb4
          path: legacy-andrudis
          fetch-depth: 1

      - name: Build full legacy inventory and graph
        run: >-
          python mods/SPT-Andrudis-Curated/tools/build_inventory.py
          legacy-andrudis/db/QuestBundles
          --rules mods/SPT-Andrudis-Curated/manifests/seed-rules.json
          --output build/andrudis-inventory.json

      - name: Print inventory summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/andrudis-inventory.json').read_text(encoding='utf-8'))
          print(json.dumps(data['summary'], indent=2, ensure_ascii=False))
          if data['summary']['parseErrorCount'] != 0:
              raise SystemExit('legacy corpus contains parse errors')
          PY

      - name: Upload transient inventory report
        uses: actions/upload-artifact@v4
        with:
          name: andrudis-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/andrudis-inventory.json
          if-no-files-found: error
          retention-days: 7
