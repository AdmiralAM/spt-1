name: Build Item Intelligence 4.1.3 runtime

on:
  push:
    branches: [ build/item-intelligence-413-runtime ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
      - name: Test Item Intelligence
        shell: pwsh
        run: dotnet run --project mods/SPT-Item-Intelligence/tests/SPT-Item-Intelligence.Tests.csproj -c Release
      - name: Build client
        shell: pwsh
        run: dotnet build mods/SPT-Item-Intelligence/src/SPT-Item-Intelligence.csproj -c Release
      - name: Build server
        shell: pwsh
        run: dotnet build mods/SPT-Item-Intelligence/server/SPT-Item-Intelligence.Server.csproj -c Release
      - name: Package runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/BepInEx/plugins/'SPT Item Intelligence' | Out-Null
          New-Item -ItemType Directory -Force -Path runtime/user/mods/'SPT Item Intelligence Server' | Out-Null
          Copy-Item 'mods/SPT-Item-Intelligence/src/bin/Release/netstandard2.1/SPT Item Intelligence.dll' 'runtime/BepInEx/plugins/SPT Item Intelligence/SPT Item Intelligence.dll'
          Copy-Item 'mods/SPT-Item-Intelligence/server/bin/Release/net10.0/SPT Item Intelligence Server.dll' 'runtime/user/mods/SPT Item Intelligence Server/SPT Item Intelligence Server.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: item-intelligence-413-runtime
          path: runtime
          if-no-files-found: error
