name: Build SPT PopCounter

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build-status/**'
      - 'build-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and capture log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          $ErrorActionPreference = 'Continue'
          dotnet build SPT-PopCounter/SPT-PopCounter.csproj -c Release 2>&1 | Tee-Object -FilePath build-status/build.log
          $code = $LASTEXITCODE
          "BUILD_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path 'SPT-PopCounter/bin/Release/netstandard2.1/SPT-PopCounter.dll') {
            New-Item -ItemType Directory -Force -Path build-output | Out-Null
            Copy-Item 'SPT-PopCounter/bin/Release/netstandard2.1/SPT-PopCounter.dll' 'build-output/SPT-PopCounter.dll' -Force
          }
          exit 0

      - name: Commit build result back to repository
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/build.log
          if (Test-Path 'build-output/SPT-PopCounter.dll') { git add -f build-output/SPT-PopCounter.dll }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Update PopCounter build result [skip ci]'
            git push
          }

      - name: Fail workflow if build failed
        shell: pwsh
        run: |
          if ($env:BUILD_EXIT_CODE -ne '0') { exit 1 }

      - name: Upload DLL artifact
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SPT-PopCounter
          path: build-output/SPT-PopCounter.dll
          if-no-files-found: error
