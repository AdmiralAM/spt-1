name: Build SPT Tactical HUD

on:
  push:
    branches: [ main ]
    paths-ignore: ['build-status/**','build-output/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
      - name: Build and capture log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          $ErrorActionPreference='Continue'
          dotnet build SPT-PopCounter/SPT-PopCounter.csproj -c Release 2>&1 | Tee-Object -FilePath build-status/build.log
          $code=$LASTEXITCODE
          "BUILD_EXIT_CODE=$code" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dll='SPT-PopCounter/bin/Release/netstandard2.1/SPT Tactical HUD v1.8.1.dll'
          if(Test-Path $dll){New-Item -ItemType Directory -Force build-output|Out-Null;Remove-Item 'build-output/*.dll' -Force -ErrorAction SilentlyContinue;Copy-Item $dll 'build-output/SPT Tactical HUD v1.8.1.dll' -Force}
          exit 0
      - name: Commit result
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/build.log
          git add -A build-output
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Update Tactical HUD v1.8.1 build result [skip ci]';git push}
      - name: Fail if build failed
        shell: pwsh
        run: if($env:BUILD_EXIT_CODE -ne '0'){exit 1}
      - name: Upload DLL
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Tactical-HUD-v1.8.1
          path: build-output/SPT Tactical HUD v1.8.1.dll
          if-no-files-found: error
