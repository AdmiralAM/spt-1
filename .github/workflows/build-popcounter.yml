name: Build SPT PopCounter
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build SPT-PopCounter/SPT-PopCounter.csproj -c Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SPT-PopCounter
          path: SPT-PopCounter/bin/Release/netstandard2.1/SPT-PopCounter.dll
          if-no-files-found: error
