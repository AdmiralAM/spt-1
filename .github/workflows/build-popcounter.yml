name: Build SPT Tactical HUD

on:
  push:
    branches: [ main ]
    paths-ignore: ['build-status/**','build-output/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tactical-hud-main-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve package version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'SPT-PopCounter/SPT-PopCounter.csproj'
          $version = $proj.Project.PropertyGroup.Version
          if([string]::IsNullOrWhiteSpace($version)){ throw 'Version missing from csproj' }
          [xml]$serverProj = Get-Content 'SPT-TacticalHUD-Server/SPT-TacticalHUD-Server.csproj'
          $serverVersion = $serverProj.Project.PropertyGroup.Version
          "HUD_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HUD_NAME=SPT Tactical HUD v$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SERVER_VERSION=$serverVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $serverChanged=$true
          git rev-parse "$env:GITHUB_SHA^" 2>$null | Out-Null
          if($LASTEXITCODE -eq 0){
            git diff --quiet "$env:GITHUB_SHA^" $env:GITHUB_SHA -- SPT-TacticalHUD-Server
            $serverChanged=($LASTEXITCODE -ne 0)
          }
          "SERVER_CHANGED=$($serverChanged.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate HUD assets, normalize optics, quality gate and visual simulation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_hud_sprites.py
          python tools/normalize_hud_sprites.py
          python tools/check_hud_assets.py
          python tools/check_hud_optics.py
          python tools/check_hud_hotpaths.py
          python tools/generate_hud_preview.py
      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
      - name: Validate Item Intelligence Phase 1
        shell: pwsh
        run: dotnet run --project ItemIntelligence.Tests/ItemIntelligence.Tests.csproj -c Release
      - name: Build and capture log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          $ErrorActionPreference='Continue'
          dotnet build SPT-PopCounter/SPT-PopCounter.csproj -c Release 2>&1 | Tee-Object -FilePath build-status/client-build.log
          $clientCode=$LASTEXITCODE
          dotnet build SPT-TacticalHUD-Server/SPT-TacticalHUD-Server.csproj -c Release 2>&1 | Tee-Object -FilePath build-status/server-build.log
          $serverCode=$LASTEXITCODE
          Get-Content build-status/client-build.log,build-status/server-build.log | Set-Content build-status/build.log
          $code=if(($clientCode -eq 0) -and ($serverCode -eq 0)){0}else{1}
          "BUILD_EXIT_CODE=$code" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dll="SPT-PopCounter/bin/Release/netstandard2.1/$env:HUD_NAME.dll"
          $serverDll='SPT-TacticalHUD-Server/bin/Release/net10.0/SPT Tactical HUD Server.dll'
          if((Test-Path $dll) -and (Test-Path $serverDll)){
            Remove-Item 'build-output' -Recurse -Force -ErrorAction SilentlyContinue
            $package="build-output/$env:HUD_NAME"
            $client="$package/BepInEx/plugins/$env:HUD_NAME"
            New-Item -ItemType Directory -Force -Path "$client/assets" | Out-Null
            Copy-Item $dll "$client/$env:HUD_NAME.dll" -Force
            Copy-Item 'SPT-PopCounter/assets/hud-sprites.png' "$client/assets/hud-sprites.png" -Force
            if($env:SERVER_CHANGED -eq 'true'){
              $server="$package/SPT_Runtime/user/mods/SPT Tactical HUD Server"
              New-Item -ItemType Directory -Force -Path $server | Out-Null
              Copy-Item $serverDll "$server/SPT Tactical HUD Server.dll" -Force
            }
          }
          exit 0
      - name: Commit result
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SPT-PopCounter/assets/hud-sprites.png
          git add build-status/build.log
          git add build-status/hud-preview.png
          git add -A build-output
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m "Update Tactical HUD v$env:HUD_VERSION generated assets/build [skip ci]";git push}
      - name: Fail if build failed
        shell: pwsh
        run: if($env:BUILD_EXIT_CODE -ne '0'){exit 1}
      - name: Upload mod package
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Tactical-HUD-v${{ env.HUD_VERSION }}
          path: build-output/${{ env.HUD_NAME }}
          if-no-files-found: error
      - name: Publish stable source and install-only runtime branches
        if: env.BUILD_EXIT_CODE == '0'
        shell: pwsh
        run: |
          $stableSha=(git rev-parse HEAD).Trim()
          git push origin "$stableSha`:refs/heads/stable" --force

          $runtimeRoot=Join-Path $env:RUNNER_TEMP 'spt-tactical-hud-runtime'
          git worktree add --detach $runtimeRoot $stableSha
          Push-Location $runtimeRoot
          $runtimePublishBranch="runtime-publish-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git checkout --orphan $runtimePublishBranch
          git rm -rf .

          $package=Join-Path $env:GITHUB_WORKSPACE "build-output/$env:HUD_NAME"
          $clientSource=Join-Path $package "BepInEx/plugins/$env:HUD_NAME"
          $clientTarget=Join-Path $runtimeRoot 'BepInEx/plugins/SPT Tactical HUD'
          New-Item -ItemType Directory -Force -Path (Join-Path $clientTarget 'assets') | Out-Null
          Copy-Item (Join-Path $clientSource "$env:HUD_NAME.dll") (Join-Path $clientTarget 'SPT Tactical HUD.dll') -Force
          Copy-Item (Join-Path $clientSource 'assets/hud-sprites.png') (Join-Path $clientTarget 'assets/hud-sprites.png') -Force

          $serverSource=Join-Path $package 'SPT_Runtime'
          $serverIncluded=Test-Path $serverSource
          if($serverIncluded){ Copy-Item $serverSource $runtimeRoot -Recurse -Force }

          $manifest=[ordered]@{
            name='SPT Tactical HUD'
            channel='stable'
            client_version=$env:HUD_VERSION
            server_version=$env:SERVER_VERSION
            spt_version='4.1.x'
            source_commit=$stableSha
            server_included=$serverIncluded
          }
          $manifest | ConvertTo-Json | Set-Content (Join-Path $runtimeRoot 'runtime-manifest.json') -Encoding utf8

          $serverInstruction=if($serverIncluded){
            'This release changes the server companion; copy both BepInEx and SPT_Runtime.'
          }else{
            'The server companion is unchanged; copy only BepInEx and do not touch SPT_Runtime.'
          }
          @"
          # SPT Tactical HUD runtime

          Ready-to-install stable client: **v$env:HUD_VERSION** for SPT **4.1.x**.

          One-time migration: delete old `BepInEx/plugins/SPT Tactical HUD v...` folders, then copy the folders from this branch into the SPT game root. Future Runtime updates overwrite the unversioned `SPT Tactical HUD` folder directly. $serverInstruction

          This branch intentionally contains no source code, Python tools, previews or build logs.
          Verified source commit: **$stableSha**.
          "@ | Set-Content (Join-Path $runtimeRoot 'README.md') -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish Tactical HUD runtime v$env:HUD_VERSION"
          git push origin HEAD:refs/heads/runtime --force
          Pop-Location
          git worktree remove $runtimeRoot --force
