name: Economy Admiral Validate

on:
  push:
    branches:
      - main
      - 'feature/economy-admiral-*'
      - 'chore/economy-admiral-*'
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  workflow_dispatch:

concurrency:
  group: economy-admiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Economy Admiral module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('mods/Economy-Admiral')
          required = [
              root / 'README.md', root / 'RUNTIME_TEST.md', root / 'config/config.json',
              root / 'tools/Validate-Runtime.ps1', root / 'tools/Test-Validate-Runtime.ps1',
              root / 'server/Economy-Admiral.csproj', root / 'server/EconomyMod.cs',
              root / 'server/TypedQuestItemAccountingService.cs', root / 'server/VanillaBaselineService.cs',
              root / 'server/BaselineProvenanceCorrectionService.cs', root / 'server/PristineReportCorrectionService.cs',
              root / 'server/QuestProvenanceDeltaService.cs', root / 'server/QuestProgressionGraphService.cs',
              root / 'server/QuestAnalysisService.cs', root / 'server/CompositePolicyEvaluationService.cs',
              root / 'server/TargetProposalService.cs', root / 'server/EnforcementPlanService.cs',
              root / 'server/RuntimeEvidenceService.cs',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, missing

          config = json.loads((root / 'config/config.json').read_text(encoding='utf-8'))
          assert config['mode'] in {'Off', 'Audit', 'Enforce'}
          assert config['preset'] in {'Easy', 'Normal', 'Hard', 'Custom'}
          assert config['repeatedRaidLootDecay'] is False

          mod = (root / 'server/EconomyMod.cs').read_text(encoding='utf-8')
          for text in [
              'OnLoadOrder.PostLoad + 1000', 'var vanillaBaseline = vanillaBaselineService.GetSnapshot();',
              'CorrectPrimaryMembershipAsync(vanillaBaseline, cancellationToken)',
              'RepairPrimaryAuditReportAsync(cancellationToken)', 'CorrectPrimaryBenchmarkAsync(vanillaBaseline, cancellationToken)',
              'CorrectRewardUtilityAsync(vanillaBaseline, cancellationToken)',
              'CorrectProgressionGraphAsync(vanillaBaseline, cancellationToken)',
              'CorrectConstraintsAsync(vanillaBaseline, cancellationToken)',
              'questAnalysis = await baselineProvenanceCorrectionService.ApplyToUnifiedAnalysisAsync(questAnalysis, vanillaBaseline, cancellationToken);',
              'var questProvenance = await questProvenanceDeltaService.RunAsync(vanillaBaseline, questAnalysis, cancellationToken);',
              'enforcementPlanService.RunAsync(questAnalysis, questProvenance, cancellationToken)',
              'runtimeEvidenceService.WriteAfterAsync(vanillaBaseline, questProvenance, cancellationToken)',
          ]:
              assert text in mod, text
          assert mod.index('config.Mode == EconomyMode.Off') < mod.index('vanillaBaselineService.GetSnapshot()')
          assert mod.index('CorrectPrimaryMembershipAsync') < mod.index('RepairPrimaryAuditReportAsync') < mod.index('CorrectPrimaryBenchmarkAsync')
          assert mod.index('baselineProvenanceCorrectionService.ApplyToUnifiedAnalysisAsync') < mod.index('questProvenanceDeltaService.RunAsync') < mod.index('compositePolicyEvaluationService.RunAsync')

          baseline = (root / 'server/VanillaBaselineService.cs').read_text(encoding='utf-8')
          for text in ['Injectable(InjectionType.Singleton, TypePriority = OnLoadOrder.Watermark + 1)', 'reward.Items', 'item.Template.ToString()', 'item.Upd?.StackObjectsCount', 'MaximumPrerequisiteDepth', 'TimedConditionCount', 'LongestDistanceConstraint', 'VanillaBaselineSnapshot GetSnapshot()']:
              assert text in baseline, text
          assert 'VanillaTraderIds' not in baseline

          report_fix = (root / 'server/PristineReportCorrectionService.cs').read_text(encoding='utf-8')
          for text in ['CorrectPrimaryMembershipAsync', 'CorrectPrimaryBenchmarkAsync', 'CorrectRewardUtilityAsync', 'CorrectProgressionGraphAsync', 'CorrectConstraintsAsync', 'PristineStartupSnapshot', 'baseline.QuestIds.Contains']:
              assert text in report_fix, text

          delta = (root / 'server/QuestProvenanceDeltaService.cs').read_text(encoding='utf-8')
          for text in ['ModAdded', 'PristineModified', 'PristineUnchanged', 'RemovedPristineQuestIds', 'EnforcementAffected = false', 'ChangedDimensions']:
              assert text in delta, text

          typed_items = (root / 'server/TypedQuestItemAccountingService.cs').read_text(encoding='utf-8')
          for text in ['reward.Items', 'item.Template.ToString()', 'item.Upd?.StackObjectsCount', 'QuestRewardSourceEdges', 'typed quest-item accounting sanity gate failed', 'typed unified-analysis sanity gate failed']:
              assert text in typed_items, text

          for name in ['CompositePolicyEvaluationService.cs', 'TargetProposalService.cs']:
              text = (root / 'server' / name).read_text(encoding='utf-8')
              assert 'RunAsync(QuestAnalysisReport analysis, CancellationToken cancellationToken)' in text, name
              assert 'QuestAnalysisService questAnalysisService' not in text, name
              assert 'GetSnapshot()' not in text, name

          plan = (root / 'server/EnforcementPlanService.cs').read_text(encoding='utf-8')
          for text in [
              'RunAsync(QuestAnalysisReport analysis, QuestProvenanceDeltaReport provenance, CancellationToken cancellationToken)',
              'SchemaVersion = 4', 'ProvenanceAware = true', 'CandidateCountsByProvenance', 'CandidateCountsByEligibility',
              'MutationEligibilityPolicyVersion = 2', 'MutationEligibilityClass', 'PotentialAutomaticMutationEligible',
              'PotentialMutationDimensions', 'ResolvePotentialMutationDimensions', 'SuccessItemHandbookValue',
              'ProtectedPristine', 'PolicyEligibleModAdded', 'ReviewOnlyModAdded', 'PolicyEligibleModifiedPristine',
              'ProtectedUnchangedRewardDimensions', 'BlockedUnknownProvenance',
              'ProvenanceClass', 'PristineUntouched', 'ChangedDimensions',
              'ApplyMutations = false', 'MutationCount = 0', 'AutomaticMutationAllowed = false', 'ProposedMutation = null',
          ]:
              assert text in plan, text

          evidence = (root / 'server/RuntimeEvidenceService.cs').read_text(encoding='utf-8')
          for text in [
              'SchemaVersion = 3', 'economy-admiral-provenance-delta.json', 'RuntimeProvenanceEvidence',
              'PristineQuestCount', 'ModAddedQuestCount', 'PristineModifiedQuestCount', 'PristineUnchangedQuestCount',
              'RemovedPristineQuestCount', 'CountsConsistent', 'DatabaseUnchangedAcrossPipeline', 'DeclaredMutationCount = 0',
              'QuestProvenanceDeltaReport questProvenance',
              'TRADER={quest.Value.TraderId}', 'RESTARTABLE={quest.Value.Restartable}',
              'JsonSerializer.Serialize(quest.Value.Conditions)', 'REWARDS={JsonSerializer.Serialize(quest.Value.Rewards)}',
          ]:
              assert text in evidence, text
          assert 'FinalQuestCount - vanillaBaseline.QuestCount' not in evidence
          assert 'Add($"QUEST|{quest.Key}|{JsonSerializer.Serialize(quest.Value.Rewards)}")' not in evidence

          validator = (root / 'tools/Validate-Runtime.ps1').read_text(encoding='utf-8')
          for text in [
              'ExpectedReportCount -ne 9', 'economy-admiral-provenance-delta.json', 'CountsConsistent',
              'RemovedPristineQuestCount', 'pristine provenance partition is inconsistent', 'final provenance partition is inconsistent',
              'enforcement plan SchemaVersion must be 4', 'MutationEligibilityPolicyVersion', 'PotentialMutationDimensions',
              'ProtectedPristine', 'PolicyEligibleModAdded', 'ReviewOnlyModAdded', 'PolicyEligibleModifiedPristine',
              'ProtectedUnchangedRewardDimensions', 'BlockedUnknownProvenance', 'is not proven changed',
          ]:
              assert text in validator, text
          assert 'BaselineNotLargerThanFinal' not in validator
          assert 'FinalQuestCount - [int]$provenance.PristineQuestCount' not in validator

          smoke = (root / 'tools/Test-Validate-Runtime.ps1').read_text(encoding='utf-8')
          for text in [
              'RemovedPristineQuestCount = 2', 'CountsConsistent = $true', 'FinalQuestCount = 123',
              "MutationEligibilityPolicyVersion = 2", "PotentialMutationDimensions = @('ItemRewardBudget','Experience')",
              "MutationEligibilityClass = 'ProtectedUnchangedRewardDimensions'",
          ]:
              assert text in smoke, text

          print('Economy Admiral exact provenance + expanded zero-mutation fingerprint + dimension-scoped fail-closed eligibility contract OK')

  server:
    name: Economy Admiral .NET 10 server build
    needs: [contract]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate runtime helper syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content mods/Economy-Admiral/tools/Validate-Runtime.ps1 -Raw))
          $null = [scriptblock]::Create((Get-Content mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1 -Raw))
      - name: Smoke-test runtime helper
        shell: pwsh
        run: '& mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/server/Economy-Admiral.csproj -c Release --nologo
      - name: Stage candidate
        shell: pwsh
        env:
          EA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path 'build-output/Economy Admiral/config' | Out-Null
          Copy-Item mods/Economy-Admiral/server/bin/Release/net10.0/Economy-Admiral.dll 'build-output/Economy Admiral/Economy-Admiral.dll'
          Copy-Item mods/Economy-Admiral/config/config.json 'build-output/Economy Admiral/config/config.json'
          Copy-Item mods/Economy-Admiral/README.md 'build-output/Economy Admiral/README.md'
          Copy-Item mods/Economy-Admiral/RUNTIME_TEST.md 'build-output/Economy Admiral/RUNTIME_TEST.md'
          Copy-Item mods/Economy-Admiral/tools/Validate-Runtime.ps1 'build-output/Economy Admiral/Validate-Runtime.ps1'
          [ordered]@{
            Product = 'Economy Admiral'
            HeadSha = $env:EA_HEAD_SHA
            WorkflowRunId = $env:GITHUB_RUN_ID
            ArtifactName = 'economy-admiral-candidate'
            CompilePackageVersion = '4.1.2'
            TargetRuntime = 'SPT 4.1.3'
          } | ConvertTo-Json | Set-Content 'build-output/Economy Admiral/BUILD_INFO.json' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: economy-admiral-candidate
          path: 'build-output/Economy Admiral'
          if-no-files-found: error
          retention-days: 14
