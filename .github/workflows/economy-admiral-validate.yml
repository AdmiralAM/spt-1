name: Economy Admiral Validate

on:
  push:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  workflow_dispatch:

concurrency:
  group: economy-admiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Economy Admiral module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('mods/Economy-Admiral')
          required = [
              root / 'README.md', root / 'RUNTIME_TEST.md', root / 'config/config.json',
              root / 'tools/Validate-Runtime.ps1', root / 'tools/Test-Validate-Runtime.ps1',
              root / 'server/Economy-Admiral.csproj', root / 'server/EconomyMod.cs',
              root / 'server/TypedQuestItemAccountingService.cs',
              root / 'server/QuestProgressionGraphService.cs', root / 'server/QuestAnalysisService.cs',
              root / 'server/CompositePolicyEvaluationService.cs', root / 'server/TargetProposalService.cs',
              root / 'server/EnforcementPlanService.cs', root / 'server/RuntimeEvidenceService.cs',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, missing

          config = json.loads((root / 'config/config.json').read_text(encoding='utf-8'))
          assert config['mode'] in {'Off', 'Audit', 'Enforce'}
          assert config['preset'] in {'Easy', 'Normal', 'Hard', 'Custom'}
          assert config['repeatedRaidLootDecay'] is False

          mod = (root / 'server/EconomyMod.cs').read_text(encoding='utf-8')
          for text in [
              'OnLoadOrder.PostLoad + 1000',
              'TypedQuestItemAccountingService typedQuestItemAccountingService',
              'typedQuestItemAccountingService.RepairPrimaryAuditReportAsync(cancellationToken)',
              'var progressionSnapshot = await questProgressionGraphService.RunAsync(cancellationToken);',
              'var questAnalysis = await questAnalysisService.RunAsync(progressionSnapshot, cancellationToken);',
              'questAnalysis = await typedQuestItemAccountingService.ApplyToUnifiedAnalysisAsync(questAnalysis, cancellationToken);',
              'compositePolicyEvaluationService.RunAsync(questAnalysis, cancellationToken)',
              'targetProposalService.RunAsync(questAnalysis, cancellationToken)',
              'enforcementPlanService.RunAsync(questAnalysis, cancellationToken)',
              'runtimeEvidenceService.WriteAfterAsync(cancellationToken)',
          ]:
              assert text in mod, text
          assert mod.index('config.Mode == EconomyMode.Off') < mod.index('runtimeEvidenceService.CaptureBefore()')
          assert mod.index('auditService.RunAsync') < mod.index('RepairPrimaryAuditReportAsync')
          assert mod.index('progressionSnapshot = await questProgressionGraphService.RunAsync') < mod.index('questAnalysis = await questAnalysisService.RunAsync')
          assert mod.index('ApplyToUnifiedAnalysisAsync') < mod.index('compositePolicyEvaluationService.RunAsync')

          typed_items = (root / 'server/TypedQuestItemAccountingService.cs').read_text(encoding='utf-8')
          for text in [
              'reward.Items', 'item.Template.ToString()', 'item.Upd?.StackObjectsCount',
              'QuestRewardSourceEdges', 'VanillaQuestSamples',
              'typed quest-item accounting sanity gate failed',
              'typed unified-analysis sanity gate failed',
              'ApplyToUnifiedAnalysisAsync', 'RepairPrimaryAuditReportAsync',
          ]:
              assert text in typed_items, text
          assert 'JsonSerializer.SerializeToElement(quest.Rewards)' not in typed_items

          graph = (root / 'server/QuestProgressionGraphService.cs').read_text(encoding='utf-8')
          assert 'Task<QuestProgressionSnapshot> RunAsync' in graph
          assert 'return current;' in graph
          assert 'GetSnapshot()' not in graph
          assert 'QuestProgressionSnapshot? snapshot' not in graph

          analysis = (root / 'server/QuestAnalysisService.cs').read_text(encoding='utf-8')
          assert 'Task<QuestAnalysisReport> RunAsync(QuestProgressionSnapshot progressionSnapshot' in analysis
          assert 'progressionSnapshot.Quests' in analysis
          assert 'return report;' in analysis
          assert 'QuestProgressionGraphService progressionGraphService' not in analysis
          assert 'GetSnapshot()' not in analysis
          assert 'QuestAnalysisReport? snapshot' not in analysis

          for name in ['CompositePolicyEvaluationService.cs', 'TargetProposalService.cs', 'EnforcementPlanService.cs']:
              text = (root / 'server' / name).read_text(encoding='utf-8')
              assert 'RunAsync(QuestAnalysisReport analysis, CancellationToken cancellationToken)' in text, name
              assert 'QuestAnalysisService questAnalysisService' not in text, name
              assert 'GetSnapshot()' not in text, name

          plan = (root / 'server/EnforcementPlanService.cs').read_text(encoding='utf-8')
          assert 'ApplyMutations = false' in plan
          assert 'MutationCount = 0' in plan
          assert 'AutomaticMutationAllowed = false' in plan
          assert 'ProposedMutation = null' in plan

          evidence = (root / 'server/RuntimeEvidenceService.cs').read_text(encoding='utf-8')
          for text in ['SchemaVersion = 2', 'DatabaseUnchangedAcrossPipeline', 'RuntimeGatePassed', 'DeclaredMutationCount = 0']:
              assert text in evidence, text

          print('Economy Admiral value-threaded + typed reward-item contract OK')

  server:
    name: Economy Admiral .NET 10 server build
    needs: [contract]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate runtime helper syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content mods/Economy-Admiral/tools/Validate-Runtime.ps1 -Raw))
          $null = [scriptblock]::Create((Get-Content mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1 -Raw))
      - name: Smoke-test runtime helper
        shell: pwsh
        run: '& mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/server/Economy-Admiral.csproj -c Release --nologo
      - name: Stage candidate
        shell: pwsh
        env:
          EA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path 'build-output/Economy Admiral/config' | Out-Null
          Copy-Item mods/Economy-Admiral/server/bin/Release/net10.0/Economy-Admiral.dll 'build-output/Economy Admiral/Economy-Admiral.dll'
          Copy-Item mods/Economy-Admiral/config/config.json 'build-output/Economy Admiral/config/config.json'
          Copy-Item mods/Economy-Admiral/README.md 'build-output/Economy Admiral/README.md'
          Copy-Item mods/Economy-Admiral/RUNTIME_TEST.md 'build-output/Economy Admiral/RUNTIME_TEST.md'
          Copy-Item mods/Economy-Admiral/tools/Validate-Runtime.ps1 'build-output/Economy Admiral/Validate-Runtime.ps1'
          [ordered]@{
            Product = 'Economy Admiral'
            HeadSha = $env:EA_HEAD_SHA
            WorkflowRunId = $env:GITHUB_RUN_ID
            ArtifactName = 'economy-admiral-candidate'
            CompilePackageVersion = '4.1.2'
            TargetRuntime = 'SPT 4.1.3'
          } | ConvertTo-Json | Set-Content 'build-output/Economy Admiral/BUILD_INFO.json' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: economy-admiral-candidate
          path: 'build-output/Economy Admiral'
          if-no-files-found: error
          retention-days: 14
