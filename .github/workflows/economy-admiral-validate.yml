name: Economy Admiral Validate

on:
  push:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  workflow_dispatch:

concurrency:
  group: economy-admiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Economy Admiral module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate committed contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('mods/Economy-Admiral')
          required = [
              root / 'README.md',
              root / 'config' / 'config.json',
              root / 'server' / 'Economy-Admiral.csproj',
              root / 'server' / 'ModMetadata.cs',
              root / 'server' / 'EconomyConfig.cs',
              root / 'server' / 'EconomyMod.cs',
              root / 'server' / 'EconomyAuditService.cs',
              root / 'server' / 'RewardUtilityAuditService.cs',
              root / 'server' / 'QuestProgressionGraphService.cs',
              root / 'server' / 'QuestConstraintAuditService.cs',
              root / 'server' / 'QuestAnalysisService.cs',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing Economy Admiral files: ' + ', '.join(missing))

          config = json.loads((root / 'config' / 'config.json').read_text(encoding='utf-8'))
          assert config['mode'] in {'Off', 'Audit', 'Enforce'}
          assert config['preset'] in {'Easy', 'Normal', 'Hard', 'Custom'}
          assert config['repeatedRaidLootDecay'] is False
          assert config['reportRelativePath'].startswith('reports/economy-admiral')
          assert config['rarity']['commonMinSources'] >= config['rarity']['uncommonMinSources']
          assert config['rarity']['uncommonMinSources'] >= config['rarity']['rareMinSources']

          policy = config['customAuditPolicy']
          for key in [
              'questRewardVsVanillaMedianWarnMultiple',
              'restartableRewardVsVanillaMedianWarnMultiple',
              'normalizedRewardVsVanillaMedianWarnMultiple',
              'restartableNormalizedRewardVsVanillaMedianWarnMultiple',
              'levelGateWeight',
              'objectiveConditionWeight',
              'maxLevelGateContribution',
              'maxObjectiveContribution',
          ]:
              assert policy[key] >= 0, key
          assert policy['duplicateTraderSourcesWarnCount'] > 0

          source = (root / 'server' / 'EconomyMod.cs').read_text(encoding='utf-8')
          assert 'OnLoadOrder.PostLoad + 1000' in source
          assert 'namespace EconomyAdmiral;' in source
          for service in ['RewardUtilityAuditService', 'QuestProgressionGraphService', 'QuestConstraintAuditService', 'QuestAnalysisService']:
              assert service in source, service

          metadata = (root / 'server' / 'ModMetadata.cs').read_text(encoding='utf-8')
          assert 'Economy Admiral' in metadata
          assert 'com.admiralam.economy-admiral' in metadata

          audit = (root / 'server' / 'EconomyAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'EnforcementApplied = false', 'running read-only audit only',
              'TRADER_OFFER_MISSING_BARTER', 'TRADER_OFFER_MISSING_LOYALTY',
              'QUEST_REWARD_VALUE_OUTLIER', 'RESTARTABLE_REWARD_VALUE_OUTLIER',
              'QUEST_REWARD_BUDGET_OUTLIER', 'RESTARTABLE_REWARD_BUDGET_OUTLIER',
              'VanillaMedianNormalizedHandbookValue', 'ProgressionScore', 'SchemaVersion = 3',
              'using Path = System.IO.Path;',
          ]:
              assert invariant in audit, invariant

          utility = (root / 'server' / 'RewardUtilityAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'RewardType.Experience', 'RewardType.TraderStanding', 'RewardType.TraderUnlock',
              'RewardType.AssortmentUnlock', 'RewardType.ProductionScheme',
              'UtilityScoringApplied = false', 'SchemaVersion = 2',
              'XpVsVanillaMedian', 'StandingVsVanillaMedian', 'MedianPositiveAssortmentUnlocks',
              'No cross-dimension composite score', 'using Path = System.IO.Path;',
              'economy-admiral-reward-utility.json',
          ]:
              assert invariant in utility, invariant

          graph = (root / 'server' / 'QuestProgressionGraphService.cs').read_text(encoding='utf-8')
          for invariant in [
              'ConditionType, "Quest"', 'MaximumPrerequisiteDepth', 'CycleMemberCount',
              'SchemaVersion = 2', 'DepthAffectsRewardAllowance = false',
              'VanillaDepthBenchmark', 'VanillaRestartableDepthBenchmark', 'MedianDepth', 'P90Depth',
              'GetSnapshot()', 'economy-admiral-progression-graph.json', 'using Path = System.IO.Path;',
          ]:
              assert invariant in graph, invariant

          constraints = (root / 'server' / 'QuestConstraintAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'ConstraintsAffectRewardAllowance = false', 'CompleteInSeconds', 'OneSessionOnly',
              'OnlyFoundInRaid', 'PlantTime', 'DistanceConstraintCount', 'DaytimeConstraintCount',
              'MedianStructuredConstraintCount', 'economy-admiral-quest-constraints.json',
              'using Path = System.IO.Path;',
          ]:
              assert invariant in constraints, invariant

          analysis = (root / 'server' / 'QuestAnalysisService.cs').read_text(encoding='utf-8')
          for invariant in [
              'CompositeScoreApplied = false', 'RewardAllowanceAffected = false',
              'SuccessKnownHandbookValue', 'XpVsVanillaMedian', 'StandingVsVanillaMedian',
              'PrerequisiteDepthVsVanillaMedian', 'StructuredConstraintsVsVanillaMedian',
              'GetSnapshot()', 'economy-admiral-quest-analysis.json', 'using Path = System.IO.Path;',
          ]:
              assert invariant in analysis, invariant

          print('Economy Admiral module contract OK')

  server:
    name: Economy Admiral .NET 10 server build
    needs: [contract]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/server/Economy-Admiral.csproj -c Release --nologo
      - name: Stage candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output/Economy-Admiral/config | Out-Null
          Copy-Item mods/Economy-Admiral/server/bin/Release/net10.0/Economy-Admiral.dll build-output/Economy-Admiral/Economy-Admiral.dll
          Copy-Item mods/Economy-Admiral/config/config.json build-output/Economy-Admiral/config/config.json
          Copy-Item mods/Economy-Admiral/README.md build-output/Economy-Admiral/README.md
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: economy-admiral-candidate
          path: build-output/Economy-Admiral
          if-no-files-found: error
          retention-days: 14
