name: Economy Admiral Validate

on:
  push:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/Economy-Admiral/**'
      - '.github/workflows/economy-admiral-validate.yml'
  workflow_dispatch:

concurrency:
  group: economy-admiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Economy Admiral module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate committed contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('mods/Economy-Admiral')
          required = [
              root / 'README.md', root / 'RUNTIME_TEST.md', root / 'config' / 'config.json',
              root / 'tools' / 'Validate-Runtime.ps1', root / 'tools' / 'Test-Validate-Runtime.ps1',
              root / 'server' / 'Economy-Admiral.csproj', root / 'server' / 'ModMetadata.cs',
              root / 'server' / 'EconomyConfig.cs', root / 'server' / 'EconomyRuntimeConfigService.cs',
              root / 'server' / 'RuntimeEvidenceService.cs', root / 'server' / 'EconomyMod.cs',
              root / 'server' / 'EconomyAuditService.cs', root / 'server' / 'RewardUtilityAuditService.cs',
              root / 'server' / 'QuestProgressionGraphService.cs', root / 'server' / 'QuestConstraintAuditService.cs',
              root / 'server' / 'QuestAnalysisService.cs', root / 'server' / 'CompositePolicyEvaluationService.cs',
              root / 'server' / 'TargetProposalService.cs', root / 'server' / 'EnforcementPlanService.cs',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing Economy Admiral files: ' + ', '.join(missing))

          config = json.loads((root / 'config' / 'config.json').read_text(encoding='utf-8'))
          assert config['mode'] in {'Off', 'Audit', 'Enforce'}
          assert config['preset'] in {'Easy', 'Normal', 'Hard', 'Custom'}
          assert config['repeatedRaidLootDecay'] is False
          assert config['reportRelativePath'].startswith('reports/economy-admiral')
          assert config['rarity']['commonMinSources'] >= config['rarity']['uncommonMinSources'] >= config['rarity']['rareMinSources']
          policy = config['customAuditPolicy']
          for key in [
              'questRewardVsVanillaMedianWarnMultiple', 'restartableRewardVsVanillaMedianWarnMultiple',
              'normalizedRewardVsVanillaMedianWarnMultiple', 'restartableNormalizedRewardVsVanillaMedianWarnMultiple',
              'levelGateWeight', 'objectiveConditionWeight', 'maxLevelGateContribution', 'maxObjectiveContribution',
              'highItemValueLowStructureWarnMultiple', 'highXpLowDepthWarnMultiple',
              'highStandingLowDepthWarnMultiple', 'restartableHighItemValueWarnMultiple',
              'restartableHighXpWarnMultiple', 'lowDepthMaxRelativeMultiple', 'lowStructureMaxRelativeMultiple',
          ]:
              assert policy[key] >= 0, key
          assert policy['duplicateTraderSourcesWarnCount'] > 0

          mod = (root / 'server' / 'EconomyMod.cs').read_text(encoding='utf-8')
          for invariant in [
              'OnLoadOrder.PostLoad + 1000', 'namespace EconomyAdmiral;', 'runtimeConfigService.GetAsync',
              'config.Mode == EconomyMode.Off', 'runtimeEvidenceService.CaptureBefore()',
              'runtimeEvidenceService.WriteAfterAsync', 'EconomyAuditService', 'RewardUtilityAuditService',
              'QuestProgressionGraphService', 'QuestConstraintAuditService', 'QuestAnalysisService',
              'CompositePolicyEvaluationService', 'TargetProposalService', 'EnforcementPlanService',
          ]:
              assert invariant in mod, invariant
          assert mod.index('config.Mode == EconomyMode.Off') < mod.index('runtimeEvidenceService.CaptureBefore()')
          assert mod.index('runtimeEvidenceService.CaptureBefore()') < mod.index('auditService.RunAsync')
          assert mod.index('enforcementPlanService.RunAsync') < mod.index('runtimeEvidenceService.WriteAfterAsync')

          runtime_config = (root / 'server' / 'EconomyRuntimeConfigService.cs').read_text(encoding='utf-8')
          for invariant in ['cached', 'GetAsync(', 'config.json', 'using Path = System.IO.Path;']:
              assert invariant in runtime_config, invariant

          runtime_evidence = (root / 'server' / 'RuntimeEvidenceService.cs').read_text(encoding='utf-8')
          for invariant in [
              'IncrementalHash.CreateHash(HashAlgorithmName.SHA256)', 'DatabaseUnchangedAcrossPipeline',
              'RuntimeGatePassed', 'ApplyMutations = false', 'DeclaredMutationCount = 0',
              'ExpectedReportCount', 'PresentReportCount', 'economy-admiral-runtime-evidence.json',
              'QUEST|', 'ASSORT_ITEM|', 'ASSORT_BARTER|', 'ASSORT_LOYALTY|', 'HANDBOOK|',
          ]:
              assert invariant in runtime_evidence, invariant

          audit = (root / 'server' / 'EconomyAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'EnforcementApplied = false', 'running read-only audit only', 'TRADER_OFFER_MISSING_BARTER',
              'TRADER_OFFER_MISSING_LOYALTY', 'QUEST_REWARD_VALUE_OUTLIER', 'RESTARTABLE_REWARD_VALUE_OUTLIER',
              'QUEST_REWARD_BUDGET_OUTLIER', 'RESTARTABLE_REWARD_BUDGET_OUTLIER',
              'VanillaMedianNormalizedHandbookValue', 'ProgressionScore', 'SchemaVersion = 3',
          ]:
              assert invariant in audit, invariant

          utility = (root / 'server' / 'RewardUtilityAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'RewardType.Experience', 'RewardType.TraderStanding', 'RewardType.TraderUnlock',
              'RewardType.AssortmentUnlock', 'RewardType.ProductionScheme', 'UtilityScoringApplied = false',
              'SchemaVersion = 2', 'XpVsVanillaMedian', 'StandingVsVanillaMedian',
              'MedianPositiveAssortmentUnlocks', 'No cross-dimension composite score',
          ]:
              assert invariant in utility, invariant

          graph = (root / 'server' / 'QuestProgressionGraphService.cs').read_text(encoding='utf-8')
          for invariant in [
              'ConditionType, "Quest"', 'MaximumPrerequisiteDepth', 'CycleMemberCount', 'SchemaVersion = 2',
              'DepthAffectsRewardAllowance = false', 'VanillaDepthBenchmark', 'VanillaRestartableDepthBenchmark',
              'MedianDepth', 'P90Depth', 'GetSnapshot()',
          ]:
              assert invariant in graph, invariant

          constraints = (root / 'server' / 'QuestConstraintAuditService.cs').read_text(encoding='utf-8')
          for invariant in [
              'ConstraintsAffectRewardAllowance = false', 'CompleteInSeconds', 'OneSessionOnly',
              'OnlyFoundInRaid', 'PlantTime', 'DistanceConstraintCount', 'DaytimeConstraintCount',
              'MedianStructuredConstraintCount',
          ]:
              assert invariant in constraints, invariant

          analysis = (root / 'server' / 'QuestAnalysisService.cs').read_text(encoding='utf-8')
          for invariant in [
              'SchemaVersion = 3', 'CompositeScoreApplied = false', 'RewardAllowanceAffected = false',
              'OutlierFlagsAffectEnforcement = false', 'Policy = policy', 'FlagCounts = flagCounts',
              'HIGH_ITEM_VALUE_LOW_STRUCTURE', 'RESTARTABLE_HIGH_ITEM_VALUE', 'PREREQUISITE_CYCLE',
              'SuccessKnownHandbookValue', 'XpVsVanillaMedian', 'StandingVsVanillaMedian',
              'PrerequisiteDepthVsVanillaMedian', 'StructuredConstraintsVsVanillaMedian', 'GetSnapshot()',
          ]:
              assert invariant in analysis, invariant

          composite = (root / 'server' / 'CompositePolicyEvaluationService.cs').read_text(encoding='utf-8')
          for invariant in [
              'SelectedCandidate = null', 'AffectsRewardAllowance = false', 'AffectsEnforcement = false',
              'RewardPeak', 'RewardMean', 'StructureAdjustedPeak', 'MedianRewardPeak', 'P90StructureAdjustedPeak',
          ]:
              assert invariant in composite, invariant

          targets = (root / 'server' / 'TargetProposalService.cs').read_text(encoding='utf-8')
          for invariant in [
              'ProposalsAreMutations = false', 'ApplyMutations = false', 'SelectedCompositePolicy = null',
              'AutomaticMutationAllowed = false', 'ProposedMutation = null', 'CandidateCeiling',
              'ReferenceVanillaMedian', 'ThresholdMultiple', 'ItemRewardBudget', 'TraderStandingAbsolute',
          ]:
              assert invariant in targets, invariant

          plan = (root / 'server' / 'EnforcementPlanService.cs').read_text(encoding='utf-8')
          for invariant in [
              'GetSnapshot()', 'ApplyMutations = false', 'MutationCount = 0', 'AutomaticMutationAllowed = false',
              'ProposedMutation = null', 'EnforceRequested', 'ReviewItemRewardBudget',
              'ReviewXpRewardBudget', 'ReviewStandingRewardBudget', 'ReviewPrerequisiteGraph',
          ]:
              assert invariant in plan, invariant

          validator = (root / 'tools' / 'Validate-Runtime.ps1').read_text(encoding='utf-8')
          for invariant in [
              '[string]$ModPath = $PSScriptRoot', 'RuntimeGatePassed', 'DatabaseUnchangedAcrossPipeline',
              'ExpectedReportCount', 'DeclaredMutationCount', 'SelectedCandidate', 'ProposalsAreMutations',
              'AutomaticMutationAllowed', 'ProposedMutation', 'MutationCount', 'exit 0', 'exit 1',
          ]:
              assert invariant in validator, invariant

          smoke = (root / 'tools' / 'Test-Validate-Runtime.ps1').read_text(encoding='utf-8')
          for invariant in ['PASS fixture', 'FAIL fixture', 'Start-Process', 'ExitCode', 'validator smoke tests PASS']:
              assert invariant in smoke, invariant

          metadata = (root / 'server' / 'ModMetadata.cs').read_text(encoding='utf-8')
          assert 'Economy Admiral' in metadata
          assert 'com.admiralam.economy-admiral' in metadata
          print('Economy Admiral module contract OK')

  server:
    name: Economy Admiral .NET 10 server build
    needs: [contract]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate runtime helper syntax
        shell: pwsh
        run: |
          $text = Get-Content mods/Economy-Admiral/tools/Validate-Runtime.ps1 -Raw
          $null = [scriptblock]::Create($text)
          $testText = Get-Content mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1 -Raw
          $null = [scriptblock]::Create($testText)
      - name: Smoke-test runtime helper
        shell: pwsh
        run: '& mods/Economy-Admiral/tools/Test-Validate-Runtime.ps1'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/server/Economy-Admiral.csproj -c Release --nologo
      - name: Stage candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-output/Economy Admiral/config' | Out-Null
          Copy-Item mods/Economy-Admiral/server/bin/Release/net10.0/Economy-Admiral.dll 'build-output/Economy Admiral/Economy-Admiral.dll'
          Copy-Item mods/Economy-Admiral/config/config.json 'build-output/Economy Admiral/config/config.json'
          Copy-Item mods/Economy-Admiral/README.md 'build-output/Economy Admiral/README.md'
          Copy-Item mods/Economy-Admiral/RUNTIME_TEST.md 'build-output/Economy Admiral/RUNTIME_TEST.md'
          Copy-Item mods/Economy-Admiral/tools/Validate-Runtime.ps1 'build-output/Economy Admiral/Validate-Runtime.ps1'
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: economy-admiral-candidate
          path: 'build-output/Economy Admiral'
          if-no-files-found: error
          retention-days: 14
