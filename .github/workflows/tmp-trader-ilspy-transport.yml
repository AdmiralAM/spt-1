name: tmp trader ilspy transport

on:
  push:
    branches:
      - tmp/trader-ilspy-transport

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install ilspycmd and capture minimal .NET runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out runtime/host/fxr runtime/shared/Microsoft.NETCore.App
          dotnet tool install ilspycmd --tool-path out
          cp /usr/share/dotnet/dotnet runtime/
          cp -a /usr/share/dotnet/host/fxr/10.* runtime/host/fxr/
          cp -a /usr/share/dotnet/shared/Microsoft.NETCore.App/10.* runtime/shared/Microsoft.NETCore.App/
          tar -czf ilspycmd-dotnet10-linux-x64.tar.gz out runtime
      - name: Upload diagnostics toolchain
        uses: actions/upload-artifact@v4
        with:
          name: trader-ilspycmd-dotnet10-linux-x64
          path: ilspycmd-dotnet10-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
