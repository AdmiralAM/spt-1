name: B&A&HB Operational Access RC

on:
  pull_request:
    branches: [main]
    paths:
      - 'mods/SPT-Belt-Armband-Inventory/operational-hotfix/**'
      - 'mods/SPT-Belt-Armband-Inventory/operational-hotfix-tests/**'
      - '.github/workflows/belt-operational-access.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bahb-operational-access-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared policy regressions
        shell: pwsh
        run: dotnet run --project mods/SPT-Belt-Armband-Inventory/operational-hotfix-tests/BAndHB.OperationalAccess.Tests.csproj -c Release
      - name: Build exact overlay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
          dotnet build mods/SPT-Belt-Armband-Inventory/operational-hotfix/BAndHB.OperationalAccess.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Overlay build failed' }
      - name: Package requested RC without replacing private runtime
        shell: pwsh
        run: |
          $root = 'artifact/BAndHB-Operational-Access-RC1'
          New-Item -ItemType Directory -Force "$root/BepInEx/plugins" | Out-Null
          $src = 'mods/SPT-Belt-Armband-Inventory/operational-hotfix'
          $dll = "$root/BepInEx/plugins/BAndHB.OperationalAccess.dll"
          Copy-Item "$src/bin/Release/netstandard2.1/BAndHB.OperationalAccess.dll" $dll
          Copy-Item "$src/README.md" "$root/README.md"
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha = '${{ github.event.pull_request.head.sha || github.sha }}'
          @("SourceSha=$sha", 'Artifact=BAndHB-Operational-Access-RC1', 'Status=RC-PHYSICAL-NOT-TESTED', 'TargetBaseline=SPT-4.1.5', 'ClientOverlayVersion=0.3.0.1', 'RequiredBaseClientSha256=ca2774ba4fc6cc1183863b8f008916f40a78e2b517e4934344286e233c26453a', "OverlaySha256=$hash", 'OriginalClientServerConfigBundlesProfiles=unchanged') | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8NoBOM
          if ((Get-ChildItem "$root/BepInEx/plugins" -File).Count -ne 1) { throw 'Unexpected extra runtime file' }
          if (Test-Path "$root/user") { throw 'Overlay must not replace server state' }
          Write-Host "Verified overlay SHA256=$hash exactHead=$sha"
      - name: Upload user-requested runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: BAndHB-Operational-Access-RC1
          path: artifact/BAndHB-Operational-Access-RC1
          if-no-files-found: error
          retention-days: 7
