name: Admiral Trader Portrait Digest

on:
  push:
    branches:
      - feature/admiral-trader-gameplay-alpha-assort
    paths:
      - 'mods/Admiral-Trader/assets/d5c27bb3169f8dfbc13f6b69.jpg'
      - 'mods/Admiral-Trader/manifests/identity-assets.json'
      - '.github/workflows/admiral-trader-portrait-digest.yml'

permissions:
  contents: read

jobs:
  portrait-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report and validate portrait binary
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          p = Path('mods/Admiral-Trader/assets/d5c27bb3169f8dfbc13f6b69.jpg')
          data = p.read_bytes()
          print(f'PORTRAIT_BYTES={len(data)}')
          print(f'PORTRAIT_SHA256={hashlib.sha256(data).hexdigest()}')
          print(f'PORTRAIT_MAGIC={data[:2].hex()}:{data[-2:].hex()}')
          if data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('portrait is not a complete JPEG')
          i = 2
          sof = {0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf}
          while i + 4 <= len(data):
              if data[i] != 0xff:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xff:
                  i += 1
              marker = data[i]; i += 1
              if marker in (0xd8,0xd9) or 0xd0 <= marker <= 0xd7:
                  continue
              n = int.from_bytes(data[i:i+2], 'big')
              if marker in sof:
                  h = int.from_bytes(data[i+3:i+5], 'big')
                  w = int.from_bytes(data[i+5:i+7], 'big')
                  print(f'PORTRAIT_DIMENSIONS={w}x{h}')
                  if (w,h) != (512,576):
                      raise SystemExit(f'portrait dimensions drift: {w}x{h}')
                  break
              i += n
          else:
              raise SystemExit('JPEG SOF not found')
