name: TEMP SPT 4.1.3 quest source proof
on:
  push:
    branches: [temp/trader-5e8-exact-source-export]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SPT 4.1.3 server
        uses: actions/checkout@v4
        with:
          repository: SP-Tushonka/server-csharp
          ref: ddce41c6c40c2ac7a7641da759bf2140a6e47505
          path: server
          fetch-depth: 1
      - name: Checkout SPT client modules
        uses: actions/checkout@v4
        with:
          repository: SP-Tushonka/modules
          ref: 3e82e3f6d331e5a3ab227dfe531e977bf79fc90d
          path: modules
          fetch-depth: 1
      - name: Print quest lifecycle references
        shell: bash
        run: |
          set -euo pipefail
          grep -Rni --exclude-dir=.git -E 'SptStatus|sptStatus|QuestStatus|client/quest/list' server/Libraries modules | head -300 || true
      - name: Upload exact SPT sources
        uses: actions/upload-artifact@v4
        with:
          name: spt413-quest-source-proof
          path: |
            server/Libraries/SPTushonka.Server.Core
            server/Libraries/SPTushonka.Server.Common
            modules/SPT.Common
            modules/SPT.Core
            modules/SPT.Custom
            modules/SPT.PrePatch
            modules/SPT.SinglePlayer
          include-hidden-files: true
          retention-days: 1