name: TEMP SPT 4.1.3 quest locale proof
on:
  push:
    branches: [temp/trader-5e8-exact-source-export]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact SPT 4.1.3 Russian locale and print quest labels
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/SP-Tushonka/server-csharp/ddce41c6c40c2ac7a7641da759bf2140a6e47505/Libraries/SPTushonka.Server.Assets/SPT_Data/database/locales/global/ru.json' -o ru.json
          python3 - <<'PY'
          import json
          d=json.load(open('ru.json',encoding='utf-8'))
          for k in ['QuestIsNew','QuestStatusLocked','QuestStatusAvailableForStart','QuestStatusStarted','QuestStatusAvailableForFinish']:
              print(f'{k}={d.get(k)!r}')
          PY