name: Admiral Trader Push CI Dispatch

on:
  push:
    branches:
      - 'feature/admiral-trader-gameplay-alpha-assort'
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-*.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: admiral-trader-push-ci-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-canonical-trader-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch default-branch registered Trader workflows for exact pushed ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            admiral-trader-validate.yml
            admiral-trader-quest-runtime-validate.yml
            admiral-trader-authored-keys-validate.yml
            admiral-trader-weapon-ammo-validate.yml
            admiral-trader-weapon-ammo-pools.yml
          )

          for workflow in "${workflows[@]}"; do
            echo "Dispatching $workflow on $TARGET_REF"
            gh workflow run "$workflow" --repo "$GH_REPO" --ref "$TARGET_REF"
          done

          echo "Feature-only candidate/baseline/profile workflows run directly from push and are intentionally not dispatched by filename."
