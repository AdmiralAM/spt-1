name: Admiral Trader Source Export

on:
  push:
    branches:
      - feature/admiral-trader-gameplay-alpha-assort

permissions:
  contents: read

jobs:
  export-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-exact-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
