name: Admiral Trader Exact Runtime Candidate

on:
  push:
    branches:
      - feature/admiral-trader-gameplay-alpha-assort

permissions:
  contents: read

jobs:
  export-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-exact-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-physical-runtime-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Materialize SPT 4.1.3 release runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/spt-runtime"
          mkdir -p "$runtime"
          docker pull ghcr.io/sp-tarkov/server-csharp:4.1.3
          cid="$(docker create ghcr.io/sp-tarkov/server-csharp:4.1.3)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/opt/spt/." "$runtime/"
          test -f "$runtime/SPTarkov.Server.Core.dll"
          echo "SPT_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Prove runtime bytes match supplied installed SPT 4.1.3
        shell: bash
        run: |
          set -euo pipefail
          cd "$SPT_RUNTIME"
          printf '%s  %s\n' \
            '9db58535db2c2d2192980704b526bc0979006db27d833f39f7907b5803101905' 'SPTarkov.Server.Core.dll' \
            '4e5c2e3286c07f13121974c101b58b29f9598114e0ed30f42988b702833e5081' 'SPTarkov.Common.dll' \
            'd7515b2ba613d9bc4dc830d7f77dff27e7ad97f0b32cf77f772ded55882a982b' 'SPTarkov.DI.dll' \
            '1ec4e9d7312678e23e40724207d871d0dd68a9518e39fe8165beb6e5f98b0961' 'SemanticVersioning.dll' \
            '0295966b8d44522eec6a3c560fbe4efcfa878d3e16ff1ab0fb3478ab17001381' 'JetBrains.Annotations.dll' \
            | sha256sum --check --strict

      - name: Build and package with maintained exact-runtime path
        shell: pwsh
        run: |
          ./mods/Admiral-Trader/tools/package_spt413_exact_candidate.ps1 -SptRoot $env:SPT_RUNTIME -ExpectedHeadSha $env:GITHUB_SHA

      - name: Verify produced physical evidence
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          $artifact = "build/Admiral-Trader-SPT413-$sha.zip"
          $sidecar = "$artifact.sha256"
          $provenance = Get-Content "build/admiral-trader-test-candidate/SPT_Runtime/user/mods/Admiral-Trader/candidate-provenance.json" -Raw | ConvertFrom-Json
          if (-not (Test-Path $artifact)) { throw "Missing exact-runtime candidate: $artifact" }
          if (-not (Test-Path $sidecar)) { throw "Missing candidate digest: $sidecar" }
          if ($provenance.sourceHeadSha -ne $sha) { throw 'Source provenance mismatch.' }
          if ($provenance.compileMode -ne 'exact-installed-runtime') { throw 'Compile mode is not exact-installed-runtime.' }
          if ($provenance.physicalRuntimeEvidenceEligible -ne $true) { throw 'Candidate is not physical-runtime-evidence eligible.' }
          if ($provenance.runtimeAssemblies.Count -ne 5) { throw 'Runtime provenance does not contain all five assemblies.' }

      - name: Upload exact SPT 4.1.3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: Admiral-Trader-SPT413-EXACT-${{ github.sha }}
          path: |
            build/Admiral-Trader-SPT413-${{ github.sha }}.zip
            build/Admiral-Trader-SPT413-${{ github.sha }}.zip.sha256
            build/admiral-trader-test-candidate/SPT_Runtime/user/mods/Admiral-Trader/candidate-provenance.json
          if-no-files-found: error
          retention-days: 14
