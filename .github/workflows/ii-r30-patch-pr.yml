name: II R30 Patch PR
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ii-r30-patch-pr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ii-r30-quest-normalization
      - name: Apply AQC-style quest normalization
        shell: pwsh
        run: |
          $path = 'mods/SPT-Item-Intelligence/src/RuntimeDataBootstrap.cs'
          $text = Get-Content $path -Raw
          $old = @'
                object conditions = JsonNode.Get(JsonNode.Get(quest, "conditions", "Conditions"), "AvailableForFinish", "availableForFinish");
                List<QuestCondition> parsed = ParseQuestConditions(conditions);
                for (int i = 0; i < parsed.Count; i++)
                {
                    QuestCondition condition = parsed[i];
                    if (state != null && state.IsConditionComplete(condition.Id)) continue;
                    if (condition.Kind == "finditem" && HasMatchingHandover(parsed, condition)) continue;
                    if (condition.Kind != "handoveritem" && condition.Kind != "finditem" &&
                        condition.Kind != "leaveitematlocation" && condition.Kind != "placebeacon") continue;

                    for (int targetIndex = 0; targetIndex < condition.Targets.Count; targetIndex++)
                    {
                        string target = condition.Targets[targetIndex];
                        if (target.Length == 0 || condition.Count <= 0) continue;
                        output.Add(new RequirementContribution(target, source, condition.Count, 0, condition.FoundInRaid, label: questLabel));
                    }
                }
'@
          $new = @'
                object conditions = JsonNode.Get(JsonNode.Get(quest, "conditions", "Conditions"), "AvailableForFinish", "availableForFinish");
                List<QuestCondition> parsed = ParseQuestConditions(conditions);
                Dictionary<string, QuestTargetRequirement> selected = new Dictionary<string, QuestTargetRequirement>(StringComparer.Ordinal);
                for (int i = 0; i < parsed.Count; i++)
                {
                    QuestCondition condition = parsed[i];
                    if (state != null && state.IsConditionComplete(condition.Id)) continue;
                    if (condition.Kind != "handoveritem" && condition.Kind != "finditem" && condition.Kind != "leaveitematlocation") continue;
                    for (int targetIndex = 0; targetIndex < condition.Targets.Count; targetIndex++)
                    {
                        string target = condition.Targets[targetIndex];
                        if (target.Length == 0 || condition.Count <= 0) continue;
                        if (condition.Kind == "leaveitematlocation")
                        {
                            if (HasFindOrHandoverTarget(parsed, target)) continue;
                            QuestTargetRequirement leave;
                            if (selected.TryGetValue(target, out leave))
                            {
                                if (leave.Kind == "leaveitematlocation") leave.Count += condition.Count;
                                continue;
                            }
                            selected[target] = new QuestTargetRequirement(condition.Kind, condition.Count, condition.FoundInRaid);
                            continue;
                        }
                        if (!selected.ContainsKey(target))
                            selected[target] = new QuestTargetRequirement(condition.Kind, condition.Count, condition.FoundInRaid);
                    }
                }
                foreach (KeyValuePair<string, QuestTargetRequirement> requirement in selected)
                    output.Add(new RequirementContribution(requirement.Key, source, requirement.Value.Count, 0, requirement.Value.FoundInRaid, label: questLabel));
'@
          if (-not $text.Contains($old)) { throw 'ProjectQuests block not found' }
          $text = $text.Replace($old, $new)
          $oldHelper = @'
        static bool HasMatchingHandover(List<QuestCondition> conditions, QuestCondition find)
        {
            for (int i = 0; i < conditions.Count; i++)
            {
                QuestCondition candidate = conditions[i];
                if (candidate.Kind != "handoveritem" || candidate.Count != find.Count) continue;
                for (int f = 0; f < find.Targets.Count; f++)
                    if (candidate.Targets.Contains(find.Targets[f])) return true;
            }
            return false;
        }
'@
          $newHelper = @'
        static bool HasFindOrHandoverTarget(List<QuestCondition> conditions, string target)
        {
            for (int i = 0; i < conditions.Count; i++)
            {
                QuestCondition candidate = conditions[i];
                if (candidate.Kind != "handoveritem" && candidate.Kind != "finditem") continue;
                if (candidate.Targets.Contains(target)) return true;
            }
            return false;
        }
'@
          if (-not $text.Contains($oldHelper)) { throw 'Old quest helper not found' }
          $text = $text.Replace($oldHelper, $newHelper)
          $anchor = @'
        sealed class QuestCondition
'@
          $insert = @'
        sealed class QuestTargetRequirement
        {
            public QuestTargetRequirement(string kind, int count, bool foundInRaid)
            {
                Kind = kind ?? string.Empty;
                Count = Math.Max(0, count);
                FoundInRaid = foundInRaid;
            }
            public string Kind { get; }
            public int Count { get; set; }
            public bool FoundInRaid { get; }
        }

        sealed class QuestCondition
'@
          if (-not $text.Contains($anchor)) { throw 'QuestCondition anchor not found' }
          $text = $text.Replace($anchor, $insert)
          Set-Content $path $text -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'II R30 normalize quest item requirements from AQC reference'
          git push
