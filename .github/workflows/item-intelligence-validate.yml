name: Item Intelligence Admiral Validate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/SPT-Item-Intelligence/src/**'
      - 'mods/SPT-Item-Intelligence/server/**'
      - 'mods/SPT-Item-Intelligence/tests/**'
      - 'mods/SPT-Item-Intelligence/README.md'
      - '.github/workflows/item-intelligence-validate.yml'
  workflow_dispatch:

concurrency:
  group: item-intelligence-admiral-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
      - name: Run Item Intelligence Admiral regression harness
        shell: pwsh
        run: dotnet run --project mods/SPT-Item-Intelligence/tests/SPT-Item-Intelligence.Tests.csproj -c Release
      - name: Build Item Intelligence Admiral client
        shell: pwsh
        run: dotnet build mods/SPT-Item-Intelligence/src/SPT-Item-Intelligence.csproj -c Release
      - name: Build Item Intelligence Admiral server
        shell: pwsh
        run: dotnet build mods/SPT-Item-Intelligence/server/SPT-Item-Intelligence.Server.csproj -c Release
      - name: Stage Item Intelligence Admiral runtime test build
        shell: pwsh
        run: |
          $clientDir = 'runtime-test/BepInEx/plugins/Item Intelligence Admiral'
          $serverDir = 'runtime-test/SPT_Runtime/user/mods/Item Intelligence Admiral Server'
          New-Item -ItemType Directory -Force -Path $clientDir | Out-Null
          New-Item -ItemType Directory -Force -Path $serverDir | Out-Null
          Copy-Item 'mods/SPT-Item-Intelligence/src/bin/Release/netstandard2.1/Item Intelligence Admiral v1.0.0.dll' "$clientDir/Item Intelligence Admiral.dll"
          Copy-Item 'mods/SPT-Item-Intelligence/server/bin/Release/net10.0/Item Intelligence Admiral Server.dll' "$serverDir/Item Intelligence Admiral Server.dll"
      - name: Upload Item Intelligence Admiral runtime test build
        uses: actions/upload-artifact@v4
        with:
          name: Item-Intelligence-Admiral-v1-runtime-test
          path: runtime-test/**
          if-no-files-found: error
          retention-days: 7
