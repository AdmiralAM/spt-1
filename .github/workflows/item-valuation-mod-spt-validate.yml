name: Item Valuation MOD SPT Validate

on:
  pull_request:
    paths:
      - 'mods/Item-Valuation-MOD-SPT/**'
      - '.github/workflows/item-valuation-mod-spt-validate.yml'
      - 'README.md'
      - 'docs/github-stable-runtime.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: item-valuation-mod-spt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate narrow source contract
        run: python mods/Item-Valuation-MOD-SPT/tools/validate_contract.py

      - name: Validate config JSON
        run: python -m json.tool mods/Item-Valuation-MOD-SPT/config/config.json > /dev/null

      - name: Build server assembly
        run: dotnet build mods/Item-Valuation-MOD-SPT/server/ItemValuationModSpt.Server.csproj -c Release

      - name: Stage exact runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          root='build/item-valuation-candidate/SPT_Runtime/user/mods/Item Valuation MOD SPT'
          mkdir -p "$root/config"
          cp 'mods/Item-Valuation-MOD-SPT/server/bin/Release/net10.0/Item Valuation MOD SPT Server.dll' "$root/"
          cp mods/Item-Valuation-MOD-SPT/config/config.json "$root/config/"
          cp mods/Item-Valuation-MOD-SPT/README.md "$root/README.md"
          test -f "$root/Item Valuation MOD SPT Server.dll"
          test -f "$root/config/config.json"
          if find build/item-valuation-candidate -type f \( -name '*BepInEx*' -o -name '*Harmony*' \) | grep -q .; then
            echo 'Unexpected client/Harmony material in candidate package' >&2
            exit 1
          fi

      - name: Upload SPT 4.1.3 runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: item-valuation-mod-spt-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/item-valuation-candidate/
          if-no-files-found: error
          retention-days: 14
