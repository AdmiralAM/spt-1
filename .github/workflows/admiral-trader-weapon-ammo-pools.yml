name: Admiral Trader Weapon Ammo Pools

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-weapon-ammo-pools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-weapon-ammo-pools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Admiral Trader unit tests
        run: python -m unittest discover -s mods/Admiral-Trader/tests -p 'test_*.py'

      - name: Fetch exact official SPT 4.1.5 databases
        run: |
          set -euo pipefail
          mkdir -p build/spt415
          archive='build/SPT-4.1.5-40743-7d7add5.7z'
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/SP-Tushonka/build/releases/download/4.1.5/SPT-4.1.5-40743-7d7add5.7z
          echo '5cc04274c88115730fe982fd12c7525d57e5fc64b6b7271ab3929383e3ac4432  build/SPT-4.1.5-40743-7d7add5.7z' | sha256sum --check --strict
          7z x "$archive" -obuild/spt415 -y > /dev/null
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path('build/spt415')
          expected = {
              'items': '/spt_data/database/templates/items.json',
              'quests': '/spt_data/database/templates/quests.json',
          }
          resolved = {}
          for key, suffix in expected.items():
              matches = [
                  path for path in root.rglob('*')
                  if path.is_file() and path.as_posix().lower().endswith(suffix)
              ]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one exact SPT 4.1.5 {key}.json, found {len(matches)}: {matches}')
              payload = json.loads(matches[0].read_text(encoding='utf-8-sig'))
              if not isinstance(payload, dict) or len(payload) < 400:
                  raise SystemExit(f'exact SPT 4.1.5 {key} database has unexpected shape/size: {type(payload).__name__} / {len(payload) if isinstance(payload, dict) else "n/a"}')
              destination = Path(f'build/exact-spt415-{key}.json')
              shutil.copyfile(matches[0], destination)
              resolved[key] = {
                  'path': matches[0].as_posix(),
                  'records': len(payload),
                  'sha256': hashlib.sha256(matches[0].read_bytes()).hexdigest(),
              }
          shutil.copyfile('build/exact-spt415-items.json', 'build/backend-items.json')
          Path('build/spt415-database-provenance.json').write_text(
              json.dumps({
                  'targetSptVersion': '4.1.5',
                  'archive': 'SPT-4.1.5-40743-7d7add5.7z',
                  'archiveSha256': '5cc04274c88115730fe982fd12c7525d57e5fc64b6b7271ab3929383e3ac4432',
                  'databases': resolved,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(resolved, sort_keys=True))
          PY
          python -m json.tool build/backend-items.json > /dev/null
          python -m json.tool build/exact-spt415-quests.json > /dev/null

      - name: Audit exact SPT 4.1.5 native quest condition shapes
        run: >-
          python mods/Admiral-Trader/tools/audit_spt415_quest_conditions.py
          build/exact-spt415-quests.json
          --output build/admiral-trader-spt415-quest-condition-audit.json

      - name: Resolve weapon and ammo candidate pools
        run: >-
          python mods/Admiral-Trader/tools/build_weapon_ammo_pools.py
          build/backend-items.json
          mods/Admiral-Trader/manifests/weapon-ammo-authored-spec.json
          --output build/admiral-trader-weapon-ammo-pools.json

      - name: Select controlled ammo capability rewards
        run: >-
          python mods/Admiral-Trader/tools/select_weapon_ammo_rewards.py
          build/admiral-trader-weapon-ammo-pools.json
          mods/Admiral-Trader/manifests/weapon-ammo-selection-policy.json
          --output build/admiral-trader-weapon-ammo-selection.json

      - name: Enforce capability and curated weapon-pool contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pools = json.loads(Path('build/admiral-trader-weapon-ammo-pools.json').read_text())
          selection = json.loads(Path('build/admiral-trader-weapon-ammo-selection.json').read_text())
          committed = json.loads(Path('mods/Admiral-Trader/manifests/weapon-ammo-capabilities.json').read_text())
          runtime_pools = json.loads(Path('mods/Admiral-Trader/manifests/weapon-family-runtime-pools.json').read_text())
          for data in (pools, selection, committed, runtime_pools):
              if data.get('targetSptVersion') != '4.1.5':
                  raise SystemExit('weapon/ammo runtime contract lost SPT 4.1.5 target')
          if set(runtime_pools['families']) != set(pools['families']):
              raise SystemExit('runtime weapon family set drifted from resolved family set')
          permanent = 0
          for family_id, family in pools['families'].items():
              candidate_ids = {row['tpl'] for row in family.get('weapons', [])}
              frozen_ids = runtime_pools['families'][family_id]
              if not frozen_ids or len(frozen_ids) != len(set(frozen_ids)):
                  raise SystemExit(f'{family_id}: empty or duplicate curated weapon pool')
              missing = sorted(set(frozen_ids) - candidate_ids)
              if missing:
                  raise SystemExit(f'{family_id}: curated weapon TPLs not present in exact SPT 4.1.5 candidate pool: {missing}')
              selected = selection['families'][family_id]
              frozen = committed['families'][family_id]
              if family_id == 'special-weapons':
                  if selected.get('permanentUnlock') or frozen.get('permanentUnlock') is not False:
                      raise SystemExit('special weapons may not receive a permanent ammunition unlock')
                  if selected.get('sampleUnits') != 1 or frozen.get('sampleUnits') != 1:
                      raise SystemExit('special weapons sample must remain exactly one unit')
                  continue
              keys = ('tpl','caliber','penetration','damage','sampleUnits','stockPerReset','buyRestriction')
              drift = {key: (selected.get(key), frozen.get(key)) for key in keys if selected.get(key) != frozen.get(key)}
              if drift:
                  raise SystemExit(f'{family_id}: committed capability drift against exact SPT 4.1.5 DB: {drift}')
              if selected.get('tier') != 'controlled' or selected['penetration'] > selected['penetrationCeiling']:
                  raise SystemExit(f'{family_id}: unsafe capability selection')
              if selected['stockPerReset'] <= 0 or selected['buyRestriction'] <= 0:
                  raise SystemExit(f'{family_id}: unlock must remain finite')
              permanent += 1
          if permanent != 6:
              raise SystemExit(f'expected exactly six permanent ammo unlocks, got {permanent}')
          PY

      - name: Compile native weapon-ammo runtime quest templates
        run: >-
          python mods/Admiral-Trader/tools/build_weapon_ammo_runtime_templates.py
          mods/Admiral-Trader/manifests/weapon-ammo-runtime-plan.json
          mods/Admiral-Trader/manifests/weapon-ammo-authored-spec.json
          mods/Admiral-Trader/manifests/weapon-ammo-capabilities.json
          mods/Admiral-Trader/manifests/weapon-family-runtime-pools.json
          --output build/admiral-trader-weapon-ammo-runtime.json

      - name: Enforce generated runtime quest contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/admiral-trader-weapon-ammo-runtime.json').read_text())
          templates = data['templates']
          if data.get('targetSptVersion') != '4.1.5':
              raise SystemExit('generated runtime templates lost SPT 4.1.5 target')
          if len(templates) != 21:
              raise SystemExit(f'expected 21 native weapon-ammo quests, got {len(templates)}')
          if len(data['deferredRuntimeItems']) != 1:
              raise SystemExit('only the Special Weapons sample item may remain deferred')
          for qid, quest in templates.items():
              if quest['traderId'] != 'd5c27bb3169f8dfbc13f6b69' or quest['restartable']:
                  raise SystemExit(f'{qid}: invalid Admiral ownership/restartability')
              finish = quest['conditions']['AvailableForFinish']
              if len(finish) != 1 or finish[0].get('conditionType') != 'CounterCreator':
                  raise SystemExit(f'{qid}: must have one native CounterCreator elimination objective')
              kill = finish[0]['counter']['conditions'][0]
              if kill.get('conditionType') != 'Kills' or not kill.get('weapon'):
                  raise SystemExit(f'{qid}: family weapon filter missing')
              if any(not isinstance(tpl, str) or len(tpl) != 24 for tpl in kill['weapon']):
                  raise SystemExit(f'{qid}: malformed weapon TPL in objective pool')
          PY

      - name: Validate committed Arsenal runtime equals compiler output
        run: >-
          python mods/Admiral-Trader/tools/validate_committed_arsenal_runtime.py
          mods/Admiral-Trader/db/quests
          build/admiral-trader-weapon-ammo-runtime.json

      - name: Upload exact-runtime Trader evidence
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-weapon-ammo-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/spt415-database-provenance.json
            build/admiral-trader-spt415-quest-condition-audit.json
            build/admiral-trader-weapon-ammo-pools.json
            build/admiral-trader-weapon-ammo-selection.json
            build/admiral-trader-weapon-ammo-runtime.json
          if-no-files-found: error
          retention-days: 7
