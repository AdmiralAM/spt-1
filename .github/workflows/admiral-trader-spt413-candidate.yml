name: Admiral Trader SPT 4.1.3 Candidate

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-spt413-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-spt413-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate test-candidate source contract
        shell: python
        run: |
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('mods/Admiral-Trader')
          runtime = json.loads((root / 'manifests/runtime-manifest.json').read_text(encoding='utf-8'))
          base = json.loads((root / 'db/base.json').read_text(encoding='utf-8'))
          capabilities = json.loads((root / 'manifests/weapon-ammo-capabilities.json').read_text(encoding='utf-8'))
          assort = json.loads((root / 'db/assort.json').read_text(encoding='utf-8'))
          questassort = json.loads((root / 'db/questassort.json').read_text(encoding='utf-8'))

          if runtime.get('targetSptVersion') != '4.1.3':
              raise SystemExit('candidate lost exact SPT 4.1.3 runtime target')
          if runtime.get('publishedApiCompileBaseline') != '4.1.3':
              raise SystemExit('published API baseline must be SPT 4.1.3')
          if runtime.get('publicationMode') != 'test-candidate-source':
              raise SystemExit('source publicationMode must be test-candidate-source')
          if runtime.get('registrationEnabled') is not False:
              raise SystemExit('source tree must remain fail-closed; only staged candidate may enable registration')
          if runtime.get('mergeRequiresRuntimeEvidence') is not True:
              raise SystemExit('candidate must require physical runtime evidence before merge')

          data = runtime.get('data') or {}
          placeholder = '/files/quest/icon/5a27cafa86f77424e20615d6.jpg'
          if data.get('avatarMode') != 'built-in-test-placeholder' or data.get('avatar') != placeholder:
              raise SystemExit('candidate avatar mode/route drift')
          if base.get('avatar') != placeholder:
              raise SystemExit('base.json must use the explicit non-final test placeholder route')
          if data.get('finalPortraitDeferred') is not True:
              raise SystemExit('test placeholder must not be represented as final portrait')

          special = (capabilities.get('families') or {}).get('special-weapons') or {}
          if special.get('tpl') != '6217726288ed9f0845317459' or special.get('sampleUnits') != 1:
              raise SystemExit('Special Weapons safe sample drift')
          if special.get('permanentUnlock') is not False:
              raise SystemExit('Special Weapons may not receive a permanent unlock')

          native_status_keys = {'started', 'success', 'fail'}
          if set(questassort) != native_status_keys:
              raise SystemExit(f'candidate questassort must use exact native lowercase keys: {sorted(native_status_keys)}; got={sorted(questassort)}')
          if len(assort.get('items') or []) != 7 or len(questassort['success']) != 7:
              raise SystemExit('candidate must retain exactly seven finite quest-gated offers')
          quest_files = list((root / 'db/quests').glob('*.json'))
          if len(quest_files) != 31:
              raise SystemExit(f'candidate must contain 31 authored quests, got {len(quest_files)}')

          project = ET.parse(root / 'server/AdmiralTrader.Server.csproj').getroot()
          props = {node.tag: (node.text or '').strip() for group in project.findall('PropertyGroup') for node in group}
          if props.get('SptRuntimeTarget') != '4.1.3' or props.get('SptPublishedApiBaseline') != '4.1.3':
              raise SystemExit('csproj runtime/baseline contract drift')
          package_refs = {
              ref.attrib.get('Include'): ref.attrib.get('Version')
              for group in project.findall('ItemGroup')
              for ref in group.findall('PackageReference')
              if ref.attrib.get('Include', '').startswith('SPTushonka.')
          }
          required_packages = {'SPTushonka.Common', 'SPTushonka.DI', 'SPTushonka.Server.Core'}
          if set(package_refs) != required_packages:
              raise SystemExit(f'SPTushonka 4.1.3 package set drift: {package_refs}')
          if any(version != '$(SptPublishedApiBaseline)' for version in package_refs.values()):
              raise SystemExit(f'SPTushonka package version drift: {package_refs}')

          exact_refs = {
              ref.attrib.get('Include')
              for group in project.findall('ItemGroup')
              if "UseExactSptRuntime" in group.attrib.get('Condition', '')
              for ref in group.findall('Reference')
          }
          required_refs = {'SPTarkov.Common', 'SPTarkov.DI', 'SPTarkov.Server.Core'}
          if not required_refs.issubset(exact_refs):
              raise SystemExit(f'exact-runtime reference path incomplete: {sorted(required_refs-exact_refs)}')

      - name: Validate exact-runtime builder PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build against published SPT 4.1.3 package line
        run: dotnet build mods/Admiral-Trader/server/AdmiralTrader.Server.csproj -c Release

      - name: Validate exact-runtime and provenance guards are present
        shell: bash
        run: |
          test -f 'mods/Admiral-Trader/server/RuntimeDataValidation.cs'
          grep -Fq 'templateTable.Items.ContainsKey' 'mods/Admiral-Trader/server/RuntimeDataValidation.cs'
          grep -Fq '4.1.3' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'
          grep -Fq 'SptRuntimeLibDir' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'
          grep -Fq 'status --porcelain --untracked-files=all' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'
          grep -Fq 'ExpectedHeadSha' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'
          grep -Fq 'candidate-provenance.json' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'
          grep -Fq 'runtimeCoreSha256' 'mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1'

      - name: Stage exact-head installable candidate
        shell: python
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          repo = Path.cwd()
          module = repo / 'mods' / 'Admiral-Trader'
          output = module / 'server' / 'bin' / 'Release' / 'net10.0'
          dll = output / 'Admiral Trader Server.dll'
          stage = repo / 'build' / 'admiral-trader-spt413-artifact' / 'SPT_Runtime' / 'user' / 'mods' / 'Admiral-Trader'
          if stage.parent.parent.parent.parent.exists():
              shutil.rmtree(stage.parent.parent.parent.parent)
          stage.mkdir(parents=True, exist_ok=True)

          if not dll.exists():
              raise SystemExit(f'built Admiral server DLL missing: {dll}')
          shutil.copy2(dll, stage / dll.name)
          shutil.copytree(module / 'db', stage / 'db')
          shutil.copytree(module / 'manifests', stage / 'manifests')

          staged_manifest_path = stage / 'manifests' / 'runtime-manifest.json'
          runtime = json.loads(staged_manifest_path.read_text(encoding='utf-8'))
          runtime['registrationEnabled'] = True
          runtime['publicationMode'] = 'test-candidate'
          staged_manifest_path.write_text(json.dumps(runtime, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          package_root = Path.home() / '.nuget' / 'packages' / 'sptushonka.server.core' / '4.1.3'
          core_candidates = list(package_root.rglob('SPTarkov.Server.Core.dll'))
          if len(core_candidates) != 1:
              raise SystemExit(f'expected one SPTarkov.Server.Core.dll in SPTushonka.Server.Core 4.1.3 cache, got {core_candidates}')
          core = core_candidates[0]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          provenance = {
              'schemaVersion': 2,
              'product': 'Admiral Trader',
              'sourceHeadSha': os.environ['SOURCE_HEAD'],
              'targetSptVersion': '4.1.3',
              'compilePackage': 'SPTushonka.Server.Core',
              'compilePackageVersion': '4.1.3',
              'runtimeAssemblyIdentity': 'SPTarkov.Server.Core.dll',
              'runtimeCoreSha256': sha256(core),
              'serverDllSha256': sha256(stage / dll.name),
              'publicationMode': 'test-candidate',
          }
          (stage / 'candidate-provenance.json').write_text(
              json.dumps(provenance, indent=2) + '\n', encoding='utf-8'
          )

          if runtime.get('registrationEnabled') is not True or runtime.get('publicationMode') != 'test-candidate':
              raise SystemExit('staged candidate did not enable test-only registration')
          if len(list((stage / 'db' / 'quests').glob('*.json'))) != 31:
              raise SystemExit('staged candidate lost authored quest files')
          junk = [p for p in stage.rglob('*') if p.is_file() and (p.suffix in {'.pdb', '.log', '.zip'} or 'temp' in p.name.lower())]
          if junk:
              raise SystemExit(f'staged candidate contains forbidden junk: {junk}')

      - name: Upload installable SPT 4.1.3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: Admiral-Trader-SPT413-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/admiral-trader-spt413-artifact/SPT_Runtime
          if-no-files-found: error
          retention-days: 14
