name: Admiral Trader SPT 4.1.3 Published API Preflight

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-spt413-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-spt413-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Gameplay Alpha source contract
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root = Path('mods/Admiral-Trader')
          runtime = json.loads((root/'manifests/runtime-manifest.json').read_text(encoding='utf-8'))
          identity = json.loads((root/'manifests/identity-assets.json').read_text(encoding='utf-8'))
          base = json.loads((root/'db/base.json').read_text(encoding='utf-8'))
          assort = json.loads((root/'db/assort.json').read_text(encoding='utf-8'))
          qa = json.loads((root/'db/questassort.json').read_text(encoding='utf-8'))
          assert runtime['targetSptVersion'] == '4.1.3'
          assert runtime['publishedApiCompileBaseline'] == '4.1.3'
          assert runtime['publicationMode'] == 'test-candidate-source' and runtime['registrationEnabled'] is False
          assert runtime['mergeRequiresRuntimeEvidence'] is True
          portrait = identity['portrait']; path = root/portrait['runtimeAsset']
          assert portrait['selectionStatus'] == 'final' and portrait['assetStatus'] == 'ingested'
          assert portrait['placeholderAllowed'] is False and portrait['substitutionAllowed'] is False
          assert portrait['sourceFileSha256'] == '2387fb3d6bc9b8a0ec677789959d7007f108744e72d7cf809ed945d459428cda'
          assert portrait['sourceDimensions'] == '1365x1536' and portrait['runtimeDimensions'] == '512x576'
          expected_route = f"/files/trader/avatar/{identity['traderId']}.jpg"
          assert portrait['runtimeRoute'] == expected_route == base['avatar']
          data = path.read_bytes()
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          assert blob == portrait['runtimeGitBlobSha1']
          assert len(assort['items']) == 11
          assert set(qa) == {'started','success','fail'} and len(qa['success']) == 7
          assert len(list((root/'db/quests').glob('*.json'))) == 31

      - name: Run Admiral Trader test suite
        run: python -m unittest discover -s mods/Admiral-Trader/tests -p 'test_*.py'

      - name: Validate exact-runtime scripts
        shell: pwsh
        run: |
          foreach ($script in @('mods/Admiral-Trader/tools/build_spt413_test_candidate.ps1','mods/Admiral-Trader/tools/package_spt413_exact_candidate.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)|Out-Null
            if ($errors.Count) { $errors | % { Write-Error $_.Message }; exit 1 }
          }

      - name: Build published SPT 4.1.3 API preflight
        run: dotnet build mods/Admiral-Trader/server/AdmiralTrader.Server.csproj -c Release

      - name: Stage exact-head preflight package
        shell: python
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import hashlib, json, os, shutil
          from pathlib import Path
          repo=Path.cwd(); module=repo/'mods/Admiral-Trader'; out=module/'server/bin/Release/net10.0'
          dll=out/'Admiral Trader Server.dll'; stage=repo/'build/admiral-trader-spt413-preflight/SPT_Runtime/user/mods/Admiral-Trader'
          if stage.parents[4].exists(): shutil.rmtree(stage.parents[4])
          stage.mkdir(parents=True)
          shutil.copy2(dll,stage/dll.name)
          for d in ('db','manifests','assets'): shutil.copytree(module/d,stage/d)
          rm=stage/'manifests/runtime-manifest.json'; runtime=json.loads(rm.read_text(encoding='utf-8'))
          runtime['registrationEnabled']=True; runtime['publicationMode']='published-api-preflight'
          rm.write_text(json.dumps(runtime,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          identity=json.loads((stage/'manifests/identity-assets.json').read_text(encoding='utf-8'))
          portrait=stage/identity['portrait']['runtimeAsset']; raw=portrait.read_bytes()
          if raw[:2]!=b'\xff\xd8' or raw[-2:]!=b'\xff\xd9': raise SystemExit('invalid portrait JPEG')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          pkg=Path.home()/'.nuget/packages/sptushonka.server.core/4.1.3'; cores=list(pkg.rglob('SPTarkov.Server.Core.dll'))
          if len(cores)!=1: raise SystemExit(f'published core count={len(cores)}')
          prov={'schemaVersion':4,'product':'Admiral Trader','sourceHeadSha':os.environ['SOURCE_HEAD'],'targetSptVersion':'4.1.3','compileMode':'published-api-preflight','compilePackage':'SPTushonka.Server.Core','compilePackageVersion':'4.1.3','publishedApiCoreSha256':sha(cores[0]),'serverDllSha256':sha(stage/dll.name),'officialPortraitRoute':identity['portrait']['runtimeRoute'],'officialPortraitSourceGitBlobSha1':identity['portrait']['runtimeGitBlobSha1'],'officialPortraitSha256':sha(portrait),'publicationMode':'published-api-preflight','physicalRuntimeEvidenceEligible':False}
          (stage/'candidate-provenance.json').write_text(json.dumps(prov,indent=2)+'\n',encoding='utf-8')
          assert len(list((stage/'db/quests').glob('*.json')))==31
          assert len(json.loads((stage/'db/assort.json').read_text())['items'])==11

      - name: Upload published-API preflight package
        uses: actions/upload-artifact@v4
        with:
          name: Admiral-Trader-SPT413-PREFLIGHT-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/admiral-trader-spt413-preflight/SPT_Runtime
          if-no-files-found: error
          retention-days: 14
