name: Artem Revival Validate

on:
  push:
    branches: [ main, artem-revival-spt-4.1.3 ]
    paths:
      - 'mods/WTT-Artem-Revival/**'
      - '.github/workflows/artem-revival-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/WTT-Artem-Revival/**'
      - '.github/workflows/artem-revival-validate.yml'
  workflow_dispatch:

concurrency:
  group: artem-revival-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Revival workspace contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate module skeleton
        shell: bash
        run: |
          test -f mods/WTT-Artem-Revival/README.md
          test -f mods/WTT-Artem-Revival/docs/revival-status.md
          test -f mods/WTT-Artem-Revival/docs/content-audit.md
          test -f mods/WTT-Artem-Revival/docs/content-classification.md
          test -f mods/WTT-Artem-Revival/docs/economy-audit.md
          test -f mods/WTT-Artem-Revival/docs/repair-log.md
          test -f mods/WTT-Artem-Revival/tools/import_runtime_core.py
          test -f mods/WTT-Artem-Revival/tools/audit_runtime_content.py
          test -f mods/WTT-Artem-Revival/tests/validate_content.py
          grep -q 'SPT 4.1.3' mods/WTT-Artem-Revival/README.md
          grep -q 'Core' mods/WTT-Artem-Revival/docs/content-audit.md

  data:
    name: Artem content/tooling integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Python tooling
        run: |
          python -m py_compile mods/WTT-Artem-Revival/tools/import_runtime_core.py
          python -m py_compile mods/WTT-Artem-Revival/tools/audit_runtime_content.py
          python -m py_compile mods/WTT-Artem-Revival/tests/validate_content.py
      - name: Validate JSON and imported runtime data when present
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess, sys

          root = Path('mods/WTT-Artem-Revival')
          candidates = list(root.rglob('*.json'))
          failed = []
          for path in candidates:
              try:
                  with path.open('r', encoding='utf-8-sig') as f:
                      json.load(f)
              except Exception as exc:
                  failed.append((str(path), str(exc)))

          if failed:
              for path, error in failed:
                  print(f'INVALID JSON: {path}: {error}')
              raise SystemExit(1)

          resources = root / 'server' / 'Resources'
          if resources.exists():
              subprocess.run([sys.executable, str(root / 'tests' / 'validate_content.py')], check=True)
              subprocess.run([sys.executable, str(root / 'tools' / 'audit_runtime_content.py'), str(resources)], check=True)
          else:
              print('Runtime Resources are external/reproducibly imported; content validator/auditor deferred until import/package stage.')

          print(f'Validated {len(candidates)} committed JSON files.')

  server:
    name: Artem .NET 10 server build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/WTT-Artem-Revival/server/WTT-Artem.Revival.csproj -c Release --nologo
      - name: Upload server DLL
        uses: actions/upload-artifact@v4
        with:
          name: artem-revival-server
          path: mods/WTT-Artem-Revival/server/bin/Release/net10.0/WTT-Artem.dll
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Artem regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile integrity test
        run: python -m py_compile mods/WTT-Artem-Revival/tests/validate_content.py
      - name: Run integrity test when Resources are committed/imported
        shell: bash
        run: |
          if [ -d mods/WTT-Artem-Revival/server/Resources ]; then
            python mods/WTT-Artem-Revival/tests/validate_content.py
          else
            echo 'Resources not committed; runtime integrity test is executed during deterministic package assembly.'
          fi
