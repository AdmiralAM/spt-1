name: Admiral Tactical HUD Validate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/Admiral-Tactical-HUD/client/**'
      - 'mods/Admiral-Tactical-HUD/server/**'
      - 'mods/Admiral-Tactical-HUD/tools/**'
      - '.github/workflows/admiral-tactical-hud-validate.yml'
  workflow_dispatch:

concurrency:
  group: admiral-tactical-hud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Admiral Tactical HUD assets and hot paths
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python mods/Admiral-Tactical-HUD/tools/generate_hud_sprites.py
          python mods/Admiral-Tactical-HUD/tools/normalize_hud_sprites.py
          python mods/Admiral-Tactical-HUD/tools/check_hud_assets.py
          python mods/Admiral-Tactical-HUD/tools/check_hud_optics.py
          python mods/Admiral-Tactical-HUD/tools/check_hud_hotpaths.py
          python mods/Admiral-Tactical-HUD/tools/generate_hud_preview.py

      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force

      - name: Build Admiral Tactical HUD client
        shell: pwsh
        run: dotnet build 'mods/Admiral-Tactical-HUD/client/Admiral-Tactical-HUD.csproj' -c Release --nologo

      - name: Build Admiral Tactical HUD server
        shell: pwsh
        run: dotnet build 'mods/Admiral-Tactical-HUD/server/Admiral-Tactical-HUD-Server.csproj' -c Release --nologo

      - name: Stage final SPT runtime package
        shell: pwsh
        run: |
          $root = 'artifacts/Admiral-Tactical-HUD-1.13.3'
          $client = Join-Path $root 'BepInEx/plugins/Admiral Tactical HUD'
          $server = Join-Path $root 'user/mods/Admiral Tactical HUD'
          New-Item -ItemType Directory -Force -Path $client | Out-Null
          New-Item -ItemType Directory -Force -Path $server | Out-Null
          Copy-Item 'mods/Admiral-Tactical-HUD/client/bin/Release/netstandard2.1/Admiral Tactical HUD.dll' (Join-Path $client 'Admiral Tactical HUD.dll')
          Copy-Item 'mods/Admiral-Tactical-HUD/server/bin/Release/net10.0/Admiral Tactical HUD Server.dll' (Join-Path $server 'Admiral Tactical HUD Server.dll')
          Copy-Item 'mods/Admiral-Tactical-HUD/README.md' (Join-Path $server 'README.md')

      - name: Upload final Admiral Tactical HUD package
        uses: actions/upload-artifact@v4
        with:
          name: Admiral-Tactical-HUD-1.13.3
          path: artifacts/Admiral-Tactical-HUD-1.13.3
          if-no-files-found: error
          retention-days: 14
