name: Tactical HUD Validate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/SPT-Tactical-HUD/client/**'
      - 'mods/SPT-Tactical-HUD/server/**'
      - 'mods/SPT-Tactical-HUD/tools/**'
      - '.github/workflows/tactical-hud-validate.yml'
  workflow_dispatch:

concurrency:
  group: tactical-hud-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Tactical HUD assets and hot paths
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python mods/SPT-Tactical-HUD/tools/generate_hud_sprites.py
          python mods/SPT-Tactical-HUD/tools/normalize_hud_sprites.py
          python mods/SPT-Tactical-HUD/tools/check_hud_assets.py
          python mods/SPT-Tactical-HUD/tools/check_hud_optics.py
          python mods/SPT-Tactical-HUD/tools/check_hud_hotpaths.py
          python mods/SPT-Tactical-HUD/tools/generate_hud_preview.py

      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force

      - name: Build Tactical HUD client
        shell: pwsh
        run: dotnet build mods/SPT-Tactical-HUD/client/SPT-Tactical-HUD.csproj -c Release --nologo

      - name: Build Tactical HUD server
        shell: pwsh
        run: dotnet build mods/SPT-Tactical-HUD/server/SPT-TacticalHUD-Server.csproj -c Release --nologo

      - name: Stage Tactical HUD runtime candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/tactical-hud/BepInEx/plugins | Out-Null
          Copy-Item 'mods/SPT-Tactical-HUD/client/bin/Release/netstandard2.1/SPT Tactical HUD v1.13.3.dll' 'artifacts/tactical-hud/BepInEx/plugins/SPT Tactical HUD v1.13.3.dll'
          @'
          SPT Tactical HUD 1.13.3 runtime acceptance candidate (PR #195)

          Install:
          1. Back up/remove the existing SPT Tactical HUD client DLL from BepInEx/plugins.
          2. Copy BepInEx/plugins/SPT Tactical HUD v1.13.3.dll from this package into the SPT root.
          3. Keep the existing server mod in user/mods; server code is unchanged by this candidate.
          4. Start SPT and verify the BepInEx log reports SPT Tactical HUD v1.13.3.
          '@ | Set-Content -Encoding UTF8 artifacts/tactical-hud/TEST-INSTALL.txt

      - name: Upload Tactical HUD runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Tactical-HUD-1.13.3-runtime-candidate
          path: artifacts/tactical-hud
          if-no-files-found: error
          retention-days: 7
