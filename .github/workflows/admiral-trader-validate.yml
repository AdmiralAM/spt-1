name: Admiral Trader Validate

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/**'
      - '.github/workflows/admiral-trader-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admiral-trader-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Admiral Trader analysis and migration tests
        run: python -m unittest discover -s mods/Admiral-Trader/tests -p 'test_*.py'

      - name: Validate maintained manifests and stable trader identity
        run: |
          python -m json.tool mods/Admiral-Trader/manifests/campaign-manifest.json > /dev/null
          python -m json.tool mods/Admiral-Trader/manifests/reward-policy.json > /dev/null
          python -m json.tool mods/Admiral-Trader/manifests/runtime-manifest.json > /dev/null
          python -m json.tool mods/Admiral-Trader/manifests/curated-quest-manifest.json > /dev/null
          python -m json.tool mods/Admiral-Trader/db/base.json > /dev/null
          python -m json.tool mods/Admiral-Trader/db/assort.json > /dev/null
          python -m json.tool mods/Admiral-Trader/db/questassort.json > /dev/null
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('mods/Admiral-Trader')
          campaign = json.loads((root / 'manifests/campaign-manifest.json').read_text(encoding='utf-8'))
          runtime = json.loads((root / 'manifests/runtime-manifest.json').read_text(encoding='utf-8'))
          base = json.loads((root / 'db/base.json').read_text(encoding='utf-8'))
          assort = json.loads((root / 'db/assort.json').read_text(encoding='utf-8'))
          questassort = json.loads((root / 'db/questassort.json').read_text(encoding='utf-8'))
          product = campaign['product']
          expected = hashlib.sha256(product['modGuid'].encode()).hexdigest()[:24]
          if product['traderId'] != expected:
              raise SystemExit(f"trader id drift: {product['traderId']} != {expected}")
          trader_id = product['traderId']
          if runtime['traderId'] != trader_id or base['_id'] != trader_id:
              raise SystemExit('runtime/base trader identity drift')
          if runtime['registrationEnabled'] is not False:
              raise SystemExit('registration must remain fail-closed until runtime release gate')
          if len(trader_id) != 24 or any(ch not in '0123456789abcdef' for ch in trader_id):
              raise SystemExit('trader id is not lower-case 24-hex')
          required_assort = {'items', 'barter_scheme', 'loyal_level_items'}
          if not required_assort.issubset(assort):
              raise SystemExit(f'assort missing native collections: {sorted(required_assort - set(assort))}')
          for key in ('Started', 'Success', 'Fail'):
              if key not in questassort or not isinstance(questassort[key], dict):
                  raise SystemExit(f'questassort missing native collection: {key}')
          PY

      - name: Build server runtime foundation
        run: dotnet build mods/Admiral-Trader/server/AdmiralTrader.Server.csproj -c Release

      - name: Validate built runtime package contract
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('mods/Admiral-Trader/server/bin/Release/net10.0')
          required = [
              out / 'manifests/campaign-manifest.json',
              out / 'manifests/reward-policy.json',
              out / 'manifests/runtime-manifest.json',
              out / 'db/base.json',
              out / 'db/assort.json',
              out / 'db/questassort.json',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'built runtime package is incomplete: {missing}')
          PY

      - name: Checkout pinned legacy corpus
        uses: actions/checkout@v4
        with:
          repository: Thirt3nth/Andrudis-Questmaniac
          ref: 4e15990ac18f469ef7818475ce8553bbbb7cebb4
          path: legacy-andrudis
          fetch-depth: 1

      - name: Build full legacy inventory and graph
        run: >-
          python mods/Admiral-Trader/tools/build_inventory.py
          legacy-andrudis/db/QuestBundles
          --rules mods/Admiral-Trader/manifests/campaign-manifest.json
          --output build/admiral-trader-inventory.json

      - name: Enforce inventory and identity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/admiral-trader-inventory.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('mods/Admiral-Trader/manifests/campaign-manifest.json').read_text(encoding='utf-8'))
          summary = data['summary']
          blockers = {
              'parseErrorCount': summary['parseErrorCount'],
              'unclassifiedCount': summary['unclassifiedCount'],
              'duplicateQuestIdCount': summary['duplicateQuestIdCount'],
              'missingPrerequisiteCount': summary['missingPrerequisiteCount'],
              'cycleCount': summary['cycleCount'],
          }
          failed = {key: value for key, value in blockers.items() if value != 0}
          if failed:
              raise SystemExit(f'inventory gate failed: {failed}')
          if summary['crossBundleEdgeCount'] != 23:
              raise SystemExit(f"pinned corpus cross-bundle edge count changed: {summary['crossBundleEdgeCount']} != 23")
          trader_id = manifest['product']['traderId']
          if trader_id in summary['legacyTraderCounts']:
              raise SystemExit(f'Admiral trader id collides with legacy trader id: {trader_id}')
          if any(row['questId'] == trader_id for row in data['quests']):
              raise SystemExit(f'Admiral trader id collides with legacy quest id: {trader_id}')
          PY

      - name: Materialize direct-publish legacy quest source set
        run: >-
          python mods/Admiral-Trader/tools/materialize_quest_templates.py
          build/admiral-trader-inventory.json
          legacy-andrudis/db/QuestBundles
          --output build/admiral-trader-curated-materialization.json

      - name: Enforce curated quest planning gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('build/admiral-trader-inventory.json').read_text(encoding='utf-8'))
          materialized = json.loads(Path('build/admiral-trader-curated-materialization.json').read_text(encoding='utf-8'))
          plan = json.loads(Path('mods/Admiral-Trader/manifests/curated-quest-manifest.json').read_text(encoding='utf-8'))
          summary = materialized['summary']
          if summary['curatedTemplateCount'] != 0:
              raise SystemExit(f"legacy template unexpectedly marked direct-publish: {summary['curatedTemplateCount']}")
          if summary['accidentalDeprecatedTemplateCount'] != 0:
              raise SystemExit('deprecated quest leaked into direct-publish runtime set')
          key_rows = [row for row in inventory['quests'] if row['bundle'] == 'Keys Proficiency']
          if len(key_rows) != 27 or any(row['curationDecision'] != 'MERGE' for row in key_rows):
              raise SystemExit('Keys Proficiency must contain exactly 27 MERGE source quests')
          source_ids = [str(qid) for group in plan['groups'] for qid in group['sourceQuestIds']]
          if len(source_ids) != len(set(source_ids)):
              raise SystemExit('curated key plan contains duplicate legacy source ids')
          expected_ids = {row['questId'] for row in key_rows}
          planned_ids = set(source_ids)
          if planned_ids != expected_ids:
              raise SystemExit(f'curated key plan coverage mismatch; missing={sorted(expected_ids-planned_ids)} extra={sorted(planned_ids-expected_ids)}')
          if len(plan['groups']) > plan['targetQuestCountMax']:
              raise SystemExit('curated key plan exceeds target quest count')
          PY

      - name: Fetch pinned official vanilla quest database
        run: >-
          curl --fail --location --retry 3
          --output build/vanilla-quests.json
          https://raw.githubusercontent.com/sp-tarkov/server-csharp/fe74b07c6361e2c6d1532dc21ba1c3b981d88d93/Libraries/SPTarkov.Server.Assets/SPT_Data/database/templates/quests.json

      - name: Build vanilla reward benchmark
        run: >-
          python mods/Admiral-Trader/tools/build_reward_benchmark.py
          build/vanilla-quests.json
          --output build/vanilla-reward-benchmark.json

      - name: Enforce vanilla benchmark gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/vanilla-reward-benchmark.json').read_text(encoding='utf-8'))
          summary = data['summary']
          if summary['questCount'] < 400:
              raise SystemExit(f"vanilla benchmark unexpectedly small: {summary['questCount']}")
          if summary['xp']['count'] != summary['questCount']:
              raise SystemExit('vanilla XP distribution does not cover every quest')
          if not data.get('questTypeBuckets'):
              raise SystemExit('vanilla benchmark has no quest-type distributions')
          PY

      - name: Upload transient analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-analysis-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/admiral-trader-inventory.json
            build/admiral-trader-curated-materialization.json
            build/vanilla-reward-benchmark.json
          if-no-files-found: error
          retention-days: 7
