name: Admiral Trader Authored Keys

on:
  pull_request:
    paths:
      - 'mods/Admiral-Trader/manifests/keys-authored-spec.json'
      - 'mods/Admiral-Trader/manifests/curated-quest-manifest.json'
      - 'mods/Admiral-Trader/manifests/campaign-manifest.json'
      - 'mods/Admiral-Trader/tools/build_inventory.py'
      - 'mods/Admiral-Trader/tools/build_reward_benchmark.py'
      - 'mods/Admiral-Trader/tools/build_keys_runtime_templates.py'
      - 'mods/Admiral-Trader/tools/validate_keys_authored_spec.py'
      - 'mods/Admiral-Trader/tests/test_build_keys_runtime_templates.py'
      - '.github/workflows/admiral-trader-authored-keys-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiral-trader-authored-keys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-authored-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Admiral Trader Python tests
        run: python -m unittest discover -s mods/Admiral-Trader/tests -p 'test_*.py'

      - name: Validate authored manifest JSON
        run: |
          python -m json.tool mods/Admiral-Trader/manifests/keys-authored-spec.json > /dev/null
          python -m json.tool mods/Admiral-Trader/manifests/curated-quest-manifest.json > /dev/null

      - name: Checkout pinned legacy corpus
        uses: actions/checkout@v4
        with:
          repository: Thirt3nth/Andrudis-Questmaniac
          ref: 4e15990ac18f469ef7818475ce8553bbbb7cebb4
          path: legacy-andrudis
          fetch-depth: 1

      - name: Build pinned legacy inventory
        run: >-
          python mods/Admiral-Trader/tools/build_inventory.py
          legacy-andrudis/db/QuestBundles
          --rules mods/Admiral-Trader/manifests/campaign-manifest.json
          --output build/admiral-trader-inventory.json

      - name: Fetch pinned official vanilla quest database
        run: >-
          curl --fail --location --retry 3
          --output build/vanilla-quests.json
          https://raw.githubusercontent.com/sp-tarkov/server-csharp/fe74b07c6361e2c6d1532dc21ba1c3b981d88d93/Libraries/SPTarkov.Server.Assets/SPT_Data/database/templates/quests.json

      - name: Build vanilla reward benchmark
        run: >-
          python mods/Admiral-Trader/tools/build_reward_benchmark.py
          build/vanilla-quests.json
          --output build/vanilla-reward-benchmark.json

      - name: Validate authored graph and reward envelopes
        run: >-
          python mods/Admiral-Trader/tools/validate_keys_authored_spec.py
          mods/Admiral-Trader/manifests/keys-authored-spec.json
          mods/Admiral-Trader/manifests/curated-quest-manifest.json
          build/vanilla-reward-benchmark.json

      - name: Compile authored keys to draft native templates
        run: >-
          python mods/Admiral-Trader/tools/build_keys_runtime_templates.py
          mods/Admiral-Trader/manifests/keys-authored-spec.json
          mods/Admiral-Trader/manifests/curated-quest-manifest.json
          build/admiral-trader-inventory.json
          legacy-andrudis/db/QuestBundles
          --output build/admiral-trader-keys-runtime.json

      - name: Enforce draft runtime-template gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/admiral-trader-keys-runtime.json').read_text(encoding='utf-8'))
          summary = data['summary']
          if summary['templateCount'] != 10:
              raise SystemExit(f"expected 10 authored key templates, got {summary['templateCount']}")
          if summary['minimumKeyPoolSize'] < 1:
              raise SystemExit('authored key template has empty source key pool')
          if summary['deferredUnlockSlotCount'] != 1:
              raise SystemExit(f"expected exactly one deferred final unlock, got {summary['deferredUnlockSlotCount']}")
          for qid, quest in data['templates'].items():
              if quest['traderId'] != data['traderId']:
                  raise SystemExit(f'{qid}: trader id drift')
              finish = quest['conditions']['AvailableForFinish']
              if len(finish) != 1 or finish[0]['conditionType'] != 'FindItem':
                  raise SystemExit(f'{qid}: authored key objective must contain exactly one FindItem condition')
              if finish[0].get('onlyFoundInRaid') is not False:
                  raise SystemExit(f'{qid}: authored key objective must not force FIR')
              if any(condition.get('conditionType') == 'HandoverItem' for condition in finish):
                  raise SystemExit(f'{qid}: legacy handover grind leaked into authored quest')
              pool = finish[0]['target']
              if any(len(str(tpl)) != 24 for tpl in pool):
                  raise SystemExit(f'{qid}: malformed key target in source pool')
          PY

      - name: Upload transient authored template audit
        uses: actions/upload-artifact@v4
        with:
          name: admiral-trader-authored-keys-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/admiral-trader-keys-runtime.json
          if-no-files-found: error
          retention-days: 7
