name: Publish SPT Mod Suite

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve module versions
        shell: pwsh
        run: |
          [xml]$hud = Get-Content 'mods/SPT-Tactical-HUD/client/SPT-Tactical-HUD.csproj'
          [xml]$hudServer = Get-Content 'mods/SPT-Tactical-HUD/server/SPT-TacticalHUD-Server.csproj'
          [xml]$ii = Get-Content 'mods/SPT-Item-Intelligence/src/SPT-Item-Intelligence.csproj'
          [xml]$iiServer = Get-Content 'mods/SPT-Item-Intelligence/server/SPT-Item-Intelligence.Server.csproj'
          [xml]$pause = Get-Content 'mods/SPT-Pause/src/SPT-Pause.csproj'
          [xml]$belt = Get-Content 'mods/SPT-Belt-Armband-Inventory/src/SPT-Belt-Armband-Inventory.csproj'
          [xml]$questClient = Get-Content 'mods/SPT-Quest-Planner/client/SPT-Quest-Planner.Client.csproj'
          [xml]$questServer = Get-Content 'mods/SPT-Quest-Planner/server/SPT-Quest-Planner.Server.csproj'

          $values = [ordered]@{
            HUD_VERSION = [string]$hud.Project.PropertyGroup.Version
            HUD_ASSEMBLY = [string]$hud.Project.PropertyGroup.AssemblyName
            HUD_SERVER_VERSION = [string]$hudServer.Project.PropertyGroup.Version
            HUD_SERVER_ASSEMBLY = [string]$hudServer.Project.PropertyGroup.AssemblyName
            II_VERSION = [string]$ii.Project.PropertyGroup.Version
            II_ASSEMBLY = [string]$ii.Project.PropertyGroup.AssemblyName
            II_SERVER_VERSION = [string]$iiServer.Project.PropertyGroup.Version
            II_SERVER_ASSEMBLY = [string]$iiServer.Project.PropertyGroup.AssemblyName
            PAUSE_VERSION = [string]$pause.Project.PropertyGroup.Version
            PAUSE_ASSEMBLY = [string]$pause.Project.PropertyGroup.AssemblyName
            BELT_VERSION = [string]$belt.Project.PropertyGroup.Version
            BELT_ASSEMBLY = [string]$belt.Project.PropertyGroup.AssemblyName
            QUEST_CLIENT_VERSION = [string]$questClient.Project.PropertyGroup.Version
            QUEST_SERVER_VERSION = [string]$questServer.Project.PropertyGroup.Version
          }

          foreach ($entry in $values.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) { throw "Missing project metadata: $($entry.Key)" }
            "$($entry.Key)=$($entry.Value)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $url = 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest $url -OutFile deps/bepinex.zip
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 5
            }
          }
          Expand-Archive deps/bepinex.zip -DestinationPath deps/BepInEx -Force
          if (-not (Test-Path deps/BepInEx/core/BepInEx.dll)) { throw 'BepInEx.dll missing after extraction' }

      - name: Validate Tactical HUD assets and hot paths
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python mods/SPT-Tactical-HUD/tools/generate_hud_sprites.py
          python mods/SPT-Tactical-HUD/tools/normalize_hud_sprites.py
          python mods/SPT-Tactical-HUD/tools/check_hud_assets.py
          python mods/SPT-Tactical-HUD/tools/check_hud_optics.py
          python mods/SPT-Tactical-HUD/tools/check_hud_hotpaths.py
          python mods/SPT-Tactical-HUD/tools/generate_hud_preview.py

      - name: Run Item Intelligence regression tests
        shell: pwsh
        run: dotnet run --project mods/SPT-Item-Intelligence/tests/SPT-Item-Intelligence.Tests.csproj -c Release

      - name: Run Pause regression tests
        shell: pwsh
        run: dotnet run --project mods/SPT-Pause/tests/SPT-Pause.Tests.csproj -c Release

      - name: Validate Belt Armband Inventory
        shell: pwsh
        run: |
          python mods/SPT-Belt-Armband-Inventory/tools/check_hotpaths.py
          dotnet run --project mods/SPT-Belt-Armband-Inventory/tests/SPT-Belt-Armband-Inventory.Tests.csproj -c Release

      - name: Run Quest Planner regression tests
        shell: pwsh
        run: dotnet test mods/SPT-Quest-Planner/tests/SPT-Quest-Planner.Tests.csproj -c Release --nologo

      - name: Build published and stable-source components
        shell: pwsh
        run: |
          dotnet build mods/SPT-Tactical-HUD/client/SPT-Tactical-HUD.csproj -c Release --nologo
          dotnet build mods/SPT-Tactical-HUD/server/SPT-TacticalHUD-Server.csproj -c Release --nologo
          dotnet build mods/SPT-Item-Intelligence/src/SPT-Item-Intelligence.csproj -c Release --nologo
          dotnet build mods/SPT-Item-Intelligence/server/SPT-Item-Intelligence.Server.csproj -c Release --nologo
          dotnet build mods/SPT-Pause/src/SPT-Pause.csproj -c Release --nologo
          dotnet build mods/SPT-Belt-Armband-Inventory/src/SPT-Belt-Armband-Inventory.csproj -c Release --nologo
          dotnet build mods/SPT-Belt-Armband-Inventory/server/SPT-Belt-Armband-Inventory.Server.csproj -c Release --nologo
          dotnet build mods/SPT-Quest-Planner/client/SPT-Quest-Planner.Client.csproj -c Release --nologo
          dotnet build mods/SPT-Quest-Planner/server/SPT-Quest-Planner.Server.csproj -c Release --nologo

      - name: Assemble deterministic runtime packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          $out = Join-Path $PWD 'build-output'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue

          function Copy-RequiredFile([string]$source, [string]$destination) {
            if (-not (Test-Path $source -PathType Leaf)) { throw "Required runtime file missing: $source" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item $source $destination -Force
          }

          function Write-PackageMetadata([string]$root, [hashtable]$manifest, [string[]]$lines) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $root 'runtime-manifest.json') -Encoding utf8
            $lines -join "`n" | Set-Content (Join-Path $root 'README.md') -Encoding utf8
          }

          $hudRoot = Join-Path $out 'SPT-Tactical-HUD'
          $hudClient = Join-Path $hudRoot 'BepInEx/plugins/SPT Tactical HUD'
          $hudServer = Join-Path $hudRoot 'SPT_Runtime/user/mods/SPT Tactical HUD Server'
          Copy-RequiredFile "mods/SPT-Tactical-HUD/client/bin/Release/netstandard2.1/$env:HUD_ASSEMBLY.dll" (Join-Path $hudClient 'SPT Tactical HUD.dll')
          Copy-RequiredFile 'mods/SPT-Tactical-HUD/client/assets/hud-sprites.png' (Join-Path $hudClient 'assets/hud-sprites.png')
          Copy-RequiredFile "mods/SPT-Tactical-HUD/server/bin/Release/net10.0/$env:HUD_SERVER_ASSEMBLY.dll" (Join-Path $hudServer 'SPT Tactical HUD Server.dll')
          Write-PackageMetadata $hudRoot ([ordered]@{ name='SPT Tactical HUD'; channel='runtime'; client_version=$env:HUD_VERSION; server_version=$env:HUD_SERVER_VERSION; spt_version='4.1.x'; source_commit=$sourceSha; client_included=$true; server_included=$true }) @('# SPT Tactical HUD runtime','',"Ready-to-install Tactical HUD $env:HUD_VERSION for SPT 4.1.x.",'','Copy this package into the SPT root. It contains the Tactical HUD client and server companion only.',"Verified source commit: $sourceSha")

          $iiRoot = Join-Path $out 'SPT-Item-Intelligence'
          $iiClient = Join-Path $iiRoot 'BepInEx/plugins/SPT Item Intelligence'
          $iiServer = Join-Path $iiRoot 'SPT_Runtime/user/mods/SPT Item Intelligence Server'
          Copy-RequiredFile "mods/SPT-Item-Intelligence/src/bin/Release/netstandard2.1/$env:II_ASSEMBLY.dll" (Join-Path $iiClient 'SPT Item Intelligence.dll')
          Copy-RequiredFile "mods/SPT-Item-Intelligence/server/bin/Release/net10.0/$env:II_SERVER_ASSEMBLY.dll" (Join-Path $iiServer 'SPT Item Intelligence Server.dll')
          Write-PackageMetadata $iiRoot ([ordered]@{ name='SPT Item Intelligence'; channel='runtime-item-intelligence'; client_version=$env:II_VERSION; server_version=$env:II_SERVER_VERSION; spt_version='4.1.x'; source_commit=$sourceSha; client_included=$true; server_included=$true }) @('# SPT Item Intelligence runtime','',"Ready-to-install Item Intelligence $env:II_VERSION for SPT 4.1.x.",'','Copy this package into the SPT root. It contains Item Intelligence client and server components only.',"Verified source commit: $sourceSha")

          $pauseRoot = Join-Path $out 'SPT-Pause'
          $pauseClient = Join-Path $pauseRoot 'BepInEx/plugins/SPT Pause'
          Copy-RequiredFile "mods/SPT-Pause/src/bin/Release/netstandard2.1/$env:PAUSE_ASSEMBLY.dll" (Join-Path $pauseClient 'SPT Pause.dll')
          Write-PackageMetadata $pauseRoot ([ordered]@{ name='SPT Pause'; channel='runtime-pause'; version=$env:PAUSE_VERSION; spt_version='4.1.x'; source_commit=$sourceSha; client_included=$true; server_included=$false }) @('# SPT Pause runtime','',"Ready-to-install SPT Pause $env:PAUSE_VERSION for SPT 4.1.x.",'','Copy this package into the SPT root. SPT Pause is client-only.',"Verified source commit: $sourceSha")

          $beltRoot = Join-Path $out 'SPT-Belt-Armband-Inventory'
          $beltClient = Join-Path $beltRoot 'BepInEx/plugins/SPT Belt Armband Inventory'
          $beltServer = Join-Path $beltRoot 'SPT_Runtime/user/mods/SPT Belt Armband Inventory Server'
          Copy-RequiredFile "mods/SPT-Belt-Armband-Inventory/src/bin/Release/netstandard2.1/$env:BELT_ASSEMBLY.dll" (Join-Path $beltClient 'SPT Belt Armband Inventory.dll')
          Copy-RequiredFile 'mods/SPT-Belt-Armband-Inventory/server/bin/Release/net10.0/SPT-Belt-Armband-Inventory.Server.dll' (Join-Path $beltServer 'SPT Belt Armband Inventory Server.dll')
          Write-PackageMetadata $beltRoot ([ordered]@{ name='SPT Belt Armband Inventory'; channel='runtime-belt-armband'; version=$env:BELT_VERSION; spt_version='4.1.x'; source_commit=$sourceSha; client_included=$true; server_included=$true }) @('# SPT Belt/Armband Inventory runtime','',"Ready-to-install Belt/Armband Inventory $env:BELT_VERSION for SPT 4.1.x.",'','Copy this package into the SPT root. It contains the current client and server components.',"Verified source commit: $sourceSha")

      - name: Validate assembled runtime packages
        shell: pwsh
        run: |
          $required = @(
            'build-output/SPT-Tactical-HUD/BepInEx/plugins/SPT Tactical HUD/SPT Tactical HUD.dll',
            'build-output/SPT-Tactical-HUD/BepInEx/plugins/SPT Tactical HUD/assets/hud-sprites.png',
            'build-output/SPT-Tactical-HUD/SPT_Runtime/user/mods/SPT Tactical HUD Server/SPT Tactical HUD Server.dll',
            'build-output/SPT-Item-Intelligence/BepInEx/plugins/SPT Item Intelligence/SPT Item Intelligence.dll',
            'build-output/SPT-Item-Intelligence/SPT_Runtime/user/mods/SPT Item Intelligence Server/SPT Item Intelligence Server.dll',
            'build-output/SPT-Pause/BepInEx/plugins/SPT Pause/SPT Pause.dll',
            'build-output/SPT-Belt-Armband-Inventory/BepInEx/plugins/SPT Belt Armband Inventory/SPT Belt Armband Inventory.dll',
            'build-output/SPT-Belt-Armband-Inventory/SPT_Runtime/user/mods/SPT Belt Armband Inventory Server/SPT Belt Armband Inventory Server.dll'
          )
          foreach ($path in $required) { if (-not (Test-Path $path -PathType Leaf)) { throw "Runtime package contract missing: $path" } }
          foreach ($root in @('SPT-Tactical-HUD','SPT-Item-Intelligence','SPT-Pause','SPT-Belt-Armband-Inventory')) {
            foreach ($metadata in @('README.md','runtime-manifest.json')) {
              $path = "build-output/$root/$metadata"
              if (-not (Test-Path $path -PathType Leaf)) { throw "Package metadata missing: $path" }
            }
          }

      - name: Upload Tactical HUD package
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Tactical-HUD-v${{ env.HUD_VERSION }}
          path: build-output/SPT-Tactical-HUD/**
          if-no-files-found: error

      - name: Upload Item Intelligence package
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Item-Intelligence-v${{ env.II_VERSION }}
          path: build-output/SPT-Item-Intelligence/**
          if-no-files-found: error

      - name: Upload Pause package
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Pause-v${{ env.PAUSE_VERSION }}
          path: build-output/SPT-Pause/**
          if-no-files-found: error

      - name: Upload Belt Armband Inventory package
        uses: actions/upload-artifact@v4
        with:
          name: SPT-Belt-Armband-Inventory-v${{ env.BELT_VERSION }}
          path: build-output/SPT-Belt-Armband-Inventory/**
          if-no-files-found: error

      - name: Publish stable and runtime channels atomically
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          function New-RuntimeCommit([string]$label, [string]$packageRoot, [string]$message) {
            $worktree = Join-Path $env:RUNNER_TEMP "publish-$label-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            git worktree add --detach $worktree $sourceSha | Out-Null
            Push-Location $worktree
            try {
              git checkout --orphan "publish-$label-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-Null
              git rm -rf . | Out-Null
              Copy-Item "$packageRoot/*" . -Recurse -Force
              git add -A
              git commit -m $message | Out-Null
              return (git rev-parse HEAD).Trim()
            } finally {
              Pop-Location
              git worktree remove $worktree --force | Out-Null
            }
          }

          $hudCommit = New-RuntimeCommit 'hud' (Join-Path $PWD 'build-output/SPT-Tactical-HUD') 'Publish Tactical HUD runtime package'
          $iiCommit = New-RuntimeCommit 'ii' (Join-Path $PWD 'build-output/SPT-Item-Intelligence') 'Publish Item Intelligence runtime package'
          $pauseCommit = New-RuntimeCommit 'pause' (Join-Path $PWD 'build-output/SPT-Pause') 'Publish Pause runtime package'
          $beltCommit = New-RuntimeCommit 'belt' (Join-Path $PWD 'build-output/SPT-Belt-Armband-Inventory') 'Publish Belt Armband Inventory runtime package'

          git push origin --force --atomic \
            "$sourceSha`:refs/heads/stable" \
            "$hudCommit`:refs/heads/runtime" \
            "$iiCommit`:refs/heads/runtime-item-intelligence" \
            "$pauseCommit`:refs/heads/runtime-pause" \
            "$beltCommit`:refs/heads/runtime-belt-armband"
