name: Temporary Trader Exact Source Export

on:
  push:
    branches:
      - tmp/trader-toolchain-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Trader source
        uses: actions/checkout@v4
        with:
          ref: cb4f5d9fa5aeda20a783f88d770a826e7eaa5ebb
          fetch-depth: 1
          path: source

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "cb4f5d9fa5aeda20a783f88d770a826e7eaa5ebb"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Upload exact clean Trader checkout
        uses: actions/upload-artifact@v4
        with:
          name: trader-exact-source-cb4f5d9f
          path: source
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
