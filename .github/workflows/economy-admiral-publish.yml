name: Publish Economy Admiral Runtime

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/economy-admiral-publish.yml'
      - 'mods/Economy-Admiral/**'
  push:
    branches:
      - 'publish/economy-admiral-runtime'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Economy Admiral identity
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'mods/Economy-Admiral/server/Economy-Admiral.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          $assembly = [string]$project.Project.PropertyGroup.AssemblyName
          if ($version -ne '0.1.0') { throw "Unexpected Economy Admiral version: $version" }
          if ($assembly -ne 'Economy-Admiral') { throw "Unexpected Economy Admiral assembly: $assembly" }
          "EA_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EA_ASSEMBLY=$assembly" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision BepInEx compile reference only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'BepInEx_x64_5.4.21.0.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'BepInEx-5.4.21'
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.21/BepInEx_x64_5.4.21.0.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $extract -Force
          $target = Join-Path $PWD 'deps/BepInEx/core'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $extract 'BepInEx/core/BepInEx.dll') (Join-Path $target 'BepInEx.dll') -Force
          if (-not (Test-Path (Join-Path $target 'BepInEx.dll') -PathType Leaf)) { throw 'BepInEx compile reference was not provisioned.' }

      - name: Build Economy Admiral server
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/server/Economy-Admiral.csproj -c Release --nologo

      - name: Build Economy Admiral F12 client
        shell: pwsh
        run: dotnet build mods/Economy-Admiral/client/Economy-Admiral.Client.csproj -c Release --nologo

      - name: Assemble complete install-only runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          $root = Join-Path $PWD 'build-output/Economy-Admiral'
          $server = Join-Path $root 'SPT_Runtime/user/mods/Economy Admiral'
          $client = Join-Path $root 'BepInEx/plugins/Economy Admiral'
          Remove-Item (Join-Path $PWD 'build-output') -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $server 'config') | Out-Null
          New-Item -ItemType Directory -Force -Path $client | Out-Null

          Copy-Item "mods/Economy-Admiral/server/bin/Release/net10.0/$env:EA_ASSEMBLY.dll" (Join-Path $server 'Economy-Admiral.dll') -Force
          Copy-Item 'mods/Economy-Admiral/client/bin/Release/netstandard2.1/Economy Admiral v0.1.0.dll' (Join-Path $client 'Economy Admiral v0.1.0.dll') -Force
          Copy-Item 'mods/Economy-Admiral/config/config.json' (Join-Path $server 'config/config.default.json') -Force
          Copy-Item 'mods/Economy-Admiral/README.md' (Join-Path $server 'README.md') -Force

          [ordered]@{
            name = 'Economy Admiral'
            channel = 'runtime-economy-admiral'
            version = $env:EA_VERSION
            spt_version = '4.1.4'
            source_commit = $sourceSha
            server = 'SPT_Runtime/user/mods/Economy Admiral/Economy-Admiral.dll'
            client = 'BepInEx/plugins/Economy Admiral/Economy Admiral v0.1.0.dll'
            settings_ui = 'BepInEx F12 Configuration Manager'
            settings_apply = 'next SPT server restart'
            config_template = 'SPT_Runtime/user/mods/Economy Admiral/config/config.default.json'
            config_runtime = 'SPT_Runtime/user/mods/Economy Admiral/config/config.json (created on first start; preserved on updates)'
            package_ownership = 'Economy Admiral player runtime only; user config, development validators and BepInEx runtime are never bundled'
            physically_accepted_settings_transport = $true
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $root 'runtime-manifest.json') -Encoding utf8

      - name: Validate complete runtime package ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'build-output/Economy-Admiral').Path
          $server = Join-Path $root 'SPT_Runtime/user/mods/Economy Admiral'
          $allowed = @(
            'BepInEx/plugins/Economy Admiral/Economy Admiral v0.1.0.dll',
            'SPT_Runtime/user/mods/Economy Admiral/Economy-Admiral.dll',
            'SPT_Runtime/user/mods/Economy Admiral/config/config.default.json',
            'SPT_Runtime/user/mods/Economy Admiral/README.md',
            'runtime-manifest.json'
          )
          $actual = Get-ChildItem $root -Recurse -File | ForEach-Object {
            $_.FullName.Substring($root.Length + 1).Replace('\','/')
          } | Sort-Object
          $unexpected = @($actual | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $actual })
          if ($unexpected.Count -gt 0) { throw "Package contains files outside the player runtime contract: $($unexpected -join ', ')" }
          if ($missing.Count -gt 0) { throw "Package is missing player runtime files: $($missing -join ', ')" }
          if (Test-Path (Join-Path $server 'config/config.json') -PathType Leaf) { throw 'Player package must not contain config.json; updates must preserve user settings.' }
          if ($actual | Where-Object { $_ -like 'BepInEx/core/*' -or $_ -like 'BepInEx/config/*' -or $_ -like 'BepInEx/patchers/*' }) {
            throw 'BepInEx runtime/config leakage detected.'
          }
          foreach ($rootFile in @('winhttp.dll','doorstop_config.ini','changelog.txt')) {
            if (Test-Path (Join-Path $root $rootFile) -PathType Leaf) { throw "Foreign runtime file leaked into package: $rootFile" }
          }
          foreach ($devFile in @('RUNTIME_TEST.md','Validate-Runtime.ps1','Validate-Enforce.ps1','Validate-Beta.ps1')) {
            if (Test-Path (Join-Path $server $devFile) -PathType Leaf) { throw "Development-only file leaked into player package: $devFile" }
          }
          $defaultConfig = Get-Content (Join-Path $server 'config/config.default.json') -Raw | ConvertFrom-Json
          foreach ($property in @('enableQuestEconomyCluster','enableTraderEconomyCluster','enableFleaEconomyCluster','enableLootEconomyCluster')) {
            if ($null -eq $defaultConfig.$property) { throw "Default config missing UI cluster: $property" }
          }
          $manifest = Get-Content (Join-Path $root 'runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'runtime-economy-admiral') { throw 'Wrong runtime channel' }
          if ($manifest.version -ne '0.1.0') { throw 'Wrong runtime version' }
          if ($manifest.spt_version -ne '4.1.4') { throw 'Wrong SPT target' }
          if (-not $manifest.client) { throw 'F12 client is missing from runtime manifest' }

      - name: Upload complete Economy Admiral package
        uses: actions/upload-artifact@v4
        with:
          name: Economy-Admiral-Full-v${{ env.EA_VERSION }}
          path: build-output/Economy-Admiral/**
          if-no-files-found: error

      - name: Publish runtime-economy-admiral
        if: github.event_name == 'push' && github.ref == 'refs/heads/publish/economy-admiral-runtime'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.sha }}'
          $packageRoot = (Resolve-Path 'build-output/Economy-Admiral').Path
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          $worktree = Join-Path $env:RUNNER_TEMP "publish-economy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git worktree add --detach $worktree $sourceSha | Out-Null
          Push-Location $worktree
          try {
            git checkout --orphan "publish-economy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-Null
            git rm -rf . | Out-Null
            Copy-Item (Join-Path $packageRoot '*') . -Recurse -Force
            git add -A
            git commit -m "Publish complete Economy Admiral $env:EA_VERSION runtime package" | Out-Null
            $runtimeCommit = (git rev-parse HEAD).Trim()
          } finally {
            Pop-Location
            git worktree remove $worktree --force | Out-Null
          }

          git push origin --force "$runtimeCommit`:refs/heads/runtime-economy-admiral"
