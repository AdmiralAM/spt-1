name: Quest Planner Validate

on:
  push:
    branches: [ main ]
    paths:
      - 'mods/SPT-Quest-Planner/.ci-trigger'
      - '.github/workflows/quest-planner-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mods/SPT-Quest-Planner/**'
      - '.github/workflows/quest-planner-validate.yml'
  workflow_dispatch:

concurrency:
  group: quest-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Quest Planner tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        shell: pwsh
        run: dotnet test mods/SPT-Quest-Planner/tests/SPT-Quest-Planner.Tests.csproj -c Release --nologo

  client:
    name: Quest Planner client build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download BepInEx 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile deps/bepinex.zip
          Expand-Archive deps/bepinex.zip -DestinationPath deps -Force
      - name: Build client
        shell: pwsh
        run: dotnet build mods/SPT-Quest-Planner/client/SPT-Quest-Planner.Client.csproj -c Release --nologo
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-planner-client
          path: mods/SPT-Quest-Planner/client/bin/Release/netstandard2.1/*.dll
          if-no-files-found: error

  server:
    name: Quest Planner server build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build server
        shell: pwsh
        run: dotnet build mods/SPT-Quest-Planner/server/SPT-Quest-Planner.Server.csproj -c Release --nologo
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-planner-server
          path: mods/SPT-Quest-Planner/server/bin/Release/net10.0/*.dll
          if-no-files-found: error

  record:
    name: Record Quest Planner validation evidence
    if: ${{ always() && github.event_name == 'push' }}
    needs: [tests, client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Write validation result
        shell: bash
        run: |
          mkdir -p mods/SPT-Quest-Planner/build-status
          cat > mods/SPT-Quest-Planner/build-status/latest.txt <<EOF
          Quest Planner validation
          source_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          tests=${{ needs.tests.result }}
          client=${{ needs.client.result }}
          server=${{ needs.server.result }}
          EOF
      - name: Commit validation evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/SPT-Quest-Planner/build-status/latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Quest Planner validation evidence [skip ci]'
          git push
