name: Icebreaker Integration Validate

on:
  pull_request:
    paths:
      - "integrations/Icebreaker/**"
      - ".github/workflows/icebreaker-integration-validate.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "integrations/Icebreaker/**"
      - ".github/workflows/icebreaker-integration-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icebreaker-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate owned integration contract
        shell: pwsh
        run: ./integrations/Icebreaker/Validate-Integration.ps1
